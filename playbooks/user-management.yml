---
- name: User Management Playbook
  hosts: localhost
  become: yes
  vars_files:
    # Load ALL your user variables from this ONE file
    # This file is NOT in git - it stays on your server only
    # Create it: cp vars/users.local.yml.example vars/users.local.yml
    # Then edit it with all your users, passwords, SSH keys, etc.
    - ../vars/users.local.yml
  
  tasks:
    - name: Include user management role
      include_role:
        name: user_management

