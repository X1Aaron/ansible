---
- name: User Management Playbook
  hosts: localhost
  become: yes
  vars_files:
    - ../vars/users.yml
    # Vault file will be automatically decrypted if encrypted
    # Create and encrypt it first: ansible-vault encrypt vault/passwords.yml
    - ../vault/passwords.yml
  
  tasks:
    - name: Include user management role
      include_role:
        name: user_management
      vars:
        action: "{{ user_action | default('create') }}"

