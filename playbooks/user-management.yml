---
- name: User Management Playbook
  hosts: localhost
  become: yes
  vars_files:
    # Load your user definitions from this file
    # Create it by copying: cp vars/users.yml vars/users.local.yml
    - ../vars/users.local.yml
  
  tasks:
    - name: Include user management role
      include_role:
        name: user_management
      vars:
        action: "{{ user_action | default('create') }}"

