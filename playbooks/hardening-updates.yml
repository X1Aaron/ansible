---
- name: System Updates and Auto-Updates
  hosts: localhost
  become: yes
  vars_files:
    - ../vars/hardening.local.yml
  
  tasks:
    - name: Detect OS family
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              echo "Debian"
              ;;
            rhel|centos|fedora|rocky|almalinux)
              echo "RedHat"
              ;;
            *)
              echo "Unknown"
              ;;
          esac
        elif [ -f /etc/redhat-release ]; then
          echo "RedHat"
        elif [ -f /etc/debian_version ]; then
          echo "Debian"
        else
          echo "Unknown"
        fi
      register: os_family_result
      changed_when: false
      failed_when: false

    - name: Set OS family fact
      set_fact:
        ansible_os_family: "{{ os_family_result.stdout }}"

    - name: Check if auto-updates are already configured
      when: hardening_auto_updates | default(true) and ansible_os_family == "Debian"
      block:
        - name: Check if unattended-upgrades config exists
          stat:
            path: /etc/apt/apt.conf.d/50unattended-upgrades
          register: unattended_config

        - name: Check if auto-upgrades config exists
          stat:
            path: /etc/apt/apt.conf.d/20auto-upgrades
          register: auto_upgrades_config

        - name: Check if unattended-upgrades is installed
          command: dpkg -l | grep -q "^ii.*unattended-upgrades" || echo "not_installed"
          register: unattended_installed
          changed_when: false
          failed_when: false

        - name: Display pre-check status
          debug:
            msg: |
              ============================================================================
              Pre-Check: Auto-Updates Configuration
              ============================================================================
              
              Unattended-upgrades installed: {{ 'Yes' if unattended_installed.rc == 0 else 'No' }}
              Config file exists: {{ 'Yes' if unattended_config.stat.exists else 'No' }}
              Auto-upgrades enabled: {{ 'Yes' if auto_upgrades_config.stat.exists else 'No' }}
              
              Status: {{ 'Already configured' if (unattended_config.stat.exists and auto_upgrades_config.stat.exists and unattended_installed.rc == 0) else 'Needs configuration' }}
              ============================================================================

    - name: Update system packages
      when: hardening_update_packages | default(true)
      block:
        - name: Update apt cache (Debian/Ubuntu)
          apt:
            update_cache: yes
            cache_valid_time: 3600
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Upgrade all packages (Debian/Ubuntu)
          apt:
            upgrade: dist
            autoremove: yes
            autoclean: yes
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Update packages (RHEL/CentOS)
          yum:
            name: "*"
            state: latest
          when: ansible_os_family == "RedHat"
          ignore_errors: yes

    - name: Configure automatic security updates
      when: hardening_auto_updates | default(true)
      block:
        - name: Install unattended-upgrades (Debian/Ubuntu)
          apt:
            name: unattended-upgrades
            state: present
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Configure unattended-upgrades
          copy:
            content: |
              Unattended-Upgrade::Allowed-Origins {
                  "${distro_id}:${distro_codename}-security";
                  "${distro_id}ESMApps:${distro_codename}-apps-security";
                  "${distro_id}ESM:${distro_codename}-infra-security";
              };
              Unattended-Upgrade::AutoFixInterruptedDpkg "true";
              Unattended-Upgrade::MinimalSteps "true";
              Unattended-Upgrade::Remove-Unused-Dependencies "true";
              Unattended-Upgrade::Automatic-Reboot "false";
              Unattended-Upgrade::Automatic-Reboot-Time "02:00";
              Unattended-Upgrade::Update-Package-Lists "1";
              Unattended-Upgrade::Unattended-Upgrade "1";
            dest: /etc/apt/apt.conf.d/50unattended-upgrades
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Enable automatic updates (daily)
          copy:
            content: |
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Download-Upgradeable-Packages "1";
              APT::Periodic::AutocleanInterval "7";
              APT::Periodic::Unattended-Upgrade "1";
            dest: /etc/apt/apt.conf.d/20auto-upgrades
          when: ansible_os_family == "Debian"
          ignore_errors: yes
          register: auto_upgrades_result

    - name: Verify auto-updates configuration
      when: hardening_auto_updates | default(true) and ansible_os_family == "Debian"
      block:
        - name: Verify unattended-upgrades config file exists
          stat:
            path: /etc/apt/apt.conf.d/50unattended-upgrades
          register: verify_unattended

        - name: Verify auto-upgrades config file exists
          stat:
            path: /etc/apt/apt.conf.d/20auto-upgrades
          register: verify_auto_upgrades

        - name: Verify unattended-upgrades package is installed
          command: dpkg -l | grep -q "^ii.*unattended-upgrades"
          register: verify_installed
          changed_when: false
          failed_when: false

        - name: Display verification results
          debug:
            msg: |
              ============================================================================
              Verification: Auto-Updates Configuration
              ============================================================================
              
              Unattended-upgrades installed: {{ '✅ Yes' if verify_installed.rc == 0 else '❌ No' }}
              Config file exists: {{ '✅ Yes' if verify_unattended.stat.exists else '❌ No' }}
              Auto-upgrades enabled: {{ '✅ Yes' if verify_auto_upgrades.stat.exists else '❌ No' }}
              
              {{ '✅ All checks passed!' if (verify_installed.rc == 0 and verify_unattended.stat.exists and verify_auto_upgrades.stat.exists) else '⚠️  Some checks failed - review configuration' }}
              ============================================================================

    - name: Display summary
      debug:
        msg: |
          ============================================================================
          System Updates Configuration Complete
          ============================================================================
          
          Updates: {{ 'Enabled' if (hardening_update_packages | default(true)) else 'Skipped' }}
          Auto-updates: {{ 'Enabled' if (hardening_auto_updates | default(true)) else 'Skipped' }}
          ============================================================================

