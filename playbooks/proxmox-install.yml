---
- name: Proxmox VE Installation Playbook
  hosts: localhost
  become: yes
  
  pre_tasks:
    - name: Check if configuration file exists
      stat:
        path: ../vars/proxmox.local.yml
      register: proxmox_config_file
    
    - name: Load optional configuration file
      include_vars:
        file: ../vars/proxmox.local.yml
      when: proxmox_config_file.stat.exists
      ignore_errors: yes
    
    - name: Set defaults if not already set
      set_fact:
        proxmox_release: "{{ proxmox_release | default('trixie') }}"
        proxmox_update_system: "{{ proxmox_update_system | default(true) }}"
        proxmox_install_packages: "{{ proxmox_install_packages | default(true) }}"
        proxmox_reboot_after_install: "{{ proxmox_reboot_after_install | default(true) }}"
  
  roles:
    - role: proxmox_install

