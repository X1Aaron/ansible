---
- name: Fail2ban Configuration
  hosts: localhost
  become: yes
  vars_files:
    - ../vars/hardening.local.yml
  
  handlers:
    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

  tasks:
    - name: Detect OS family
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              echo "Debian"
              ;;
            rhel|centos|fedora|rocky|almalinux)
              echo "RedHat"
              ;;
            *)
              echo "Unknown"
              ;;
          esac
        elif [ -f /etc/redhat-release ]; then
          echo "RedHat"
        elif [ -f /etc/debian_version ]; then
          echo "Debian"
        else
          echo "Unknown"
        fi
      register: os_family_result
      changed_when: false
      failed_when: false

    - name: Set OS family fact
      set_fact:
        ansible_os_family: "{{ os_family_result.stdout }}"

    - name: Install and configure fail2ban
      when: hardening_configure_fail2ban | default(true)
      block:
        - name: Install fail2ban
          package:
            name: fail2ban
            state: present
          ignore_errors: yes

        - name: Set fail2ban log path based on OS
          set_fact:
            fail2ban_logpath: "{{ '/var/log/auth.log' if ansible_os_family == 'Debian' else '/var/log/secure' }}"

        - name: Configure fail2ban
          copy:
            content: |
              [DEFAULT]
              bantime = {{ hardening_fail2ban_bantime | default(3600) }}
              findtime = {{ hardening_fail2ban_findtime | default(600) }}
              maxretry = {{ hardening_fail2ban_maxretry | default(5) }}
              destemail = {{ hardening_fail2ban_email | default('root@localhost') }}
              sendername = Fail2Ban
              action = %(action_)s

              [sshd]
              enabled = true
              port = {{ hardening_ssh_port | default('ssh') }}
              filter = sshd
              logpath = {{ fail2ban_logpath }}
            dest: /etc/fail2ban/jail.local
          notify: restart fail2ban

        - name: Start and enable fail2ban
          systemd:
            name: fail2ban
            state: started
            enabled: yes

    - name: Display summary
      debug:
        msg: |
          ============================================================================
          Fail2ban Configuration Complete
          ============================================================================
          
          Fail2ban: {{ 'Enabled' if (hardening_configure_fail2ban | default(true)) else 'Skipped' }}
          Bantime: {{ hardening_fail2ban_bantime | default(3600) }} seconds
          Max retries: {{ hardening_fail2ban_maxretry | default(5) }}
          ============================================================================

