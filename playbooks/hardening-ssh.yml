---
- name: SSH Hardening
  hosts: localhost
  become: yes
  vars_files:
    - ../vars/hardening.local.yml
  
  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted

  tasks:
    - name: Pre-flight safety checks
      when: hardening_ssh_harden | default(true) and (hardening_ssh_password_auth | default("no")) == "no"
      block:
        - name: Get actual login username (not effective user)
          shell: |
            logname 2>/dev/null || echo "$SUDO_USER" || who am i | awk '{print $1}' || id -un
          register: login_user_result
          changed_when: false
          failed_when: false

        - name: Get login user's home directory
          shell: |
            LOGIN_USER=$(logname 2>/dev/null || echo "$SUDO_USER" || who am i | awk '{print $1}' || id -un)
            getent passwd "$LOGIN_USER" | cut -d: -f6
          register: user_home_result
          changed_when: false
          failed_when: false

        - name: Set login user fact
          set_fact:
            login_user: "{{ login_user_result.stdout | default('root') }}"

        - name: Set user home directory and current user facts
          set_fact:
            user_home: "{{ user_home_result.stdout | default('/home/' + login_user) }}"
            current_user: "{{ login_user }}"

        - name: Check if current user has SSH key authentication
          stat:
            path: "{{ user_home }}/.ssh/authorized_keys"
          register: user_ssh_keys
          failed_when: false

        - name: Warn if no SSH keys found and password auth will be disabled
          debug:
            msg: |
              ⚠️  WARNING: Password authentication will be DISABLED, but no SSH keys found for user '{{ current_user }}'!
              
              This could LOCK YOU OUT of the server!
              
              Before continuing:
              1. Make sure you have SSH keys configured: cat ~/.ssh/authorized_keys
              2. Test SSH key login from another terminal
              3. Have console/out-of-band access available
              4. Keep this SSH session open until you verify you can reconnect
              
              If unsure, set hardening_ssh_password_auth: "yes" in vars/hardening.local.yml
            verbosity: 0
          when: not user_ssh_keys.stat.exists or user_ssh_keys.stat.size == 0

        - name: Fail if root user and root login will be disabled
          fail:
            msg: |
              ⚠️  ERROR: You are logged in as root, but hardening will DISABLE root SSH login!
              
              This will LOCK YOU OUT!
              
              Solution:
              1. Create a regular user with sudo access first (run user-management playbook)
              2. Add your SSH key to that user
              3. Then run this hardening playbook
          when: 
            - login_user == "root"
            - (hardening_ssh_permit_root_login | default("no")) == "no"

    - name: Harden SSH configuration
      when: hardening_ssh_harden | default(true)
      block:
        - name: Backup SSH config
          copy:
            src: /etc/ssh/sshd_config
            dest: /etc/ssh/sshd_config.backup
            remote_src: yes
          when: not (hardening_ssh_config_backup | default(true) | bool == false)

        - name: Configure SSH hardening
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            state: present
            backup: yes
          loop:
            - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ hardening_ssh_permit_root_login | default("no") }}' }
            - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ hardening_ssh_password_auth | default("no") }}' }
            - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication {{ hardening_ssh_pubkey_auth | default("yes") }}' }
            - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
            - { regexp: '^#?X11Forwarding', line: 'X11Forwarding {{ hardening_ssh_x11_forwarding | default("no") }}' }
            - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ hardening_ssh_max_auth_tries | default(3) }}' }
            - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ hardening_ssh_client_alive_interval | default(300) }}' }
            - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ hardening_ssh_client_alive_count_max | default(2) }}' }
            - { regexp: '^#?Protocol', line: 'Protocol 2' }
          notify: restart sshd

        - name: Set SSH port if specified
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port'
            line: "Port {{ hardening_ssh_port }}"
            state: present
            backup: yes
          when: hardening_ssh_port is defined
          notify: restart sshd

    - name: Display summary
      debug:
        msg: |
          ============================================================================
          SSH Hardening Complete
          ============================================================================
          
          SSH config backed up to: /etc/ssh/sshd_config.backup
          Root login: {{ hardening_ssh_permit_root_login | default("no") }}
          Password auth: {{ hardening_ssh_password_auth | default("no") }}
          SSH port: {{ hardening_ssh_port | default("22") }}
          
          ⚠️  Test SSH access from another terminal before closing this session!
          ============================================================================

