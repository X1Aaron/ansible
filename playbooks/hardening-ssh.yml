---
- name: SSH Hardening
  hosts: localhost
  become: yes
  vars_files:
    - ../vars/hardening.local.yml
  
  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted

  tasks:
    - name: Pre-flight safety checks
      when: hardening_ssh_harden | default(true) and (hardening_ssh_password_auth | default("no")) == "no"
      block:
        - name: Get actual login username (not effective user)
          shell: |
            logname 2>/dev/null || echo "$SUDO_USER" || who am i | awk '{print $1}' || id -un
          register: login_user_result
          changed_when: false
          failed_when: false

        - name: Get login user's home directory
          shell: |
            LOGIN_USER=$(logname 2>/dev/null || echo "$SUDO_USER" || who am i | awk '{print $1}' || id -un)
            getent passwd "$LOGIN_USER" | cut -d: -f6
          register: user_home_result
          changed_when: false
          failed_when: false

        - name: Set login user fact
          set_fact:
            login_user: "{{ login_user_result.stdout | default('root') }}"

        - name: Set user home directory and current user facts
          set_fact:
            user_home: "{{ user_home_result.stdout | default('/home/' + login_user) }}"
            current_user: "{{ login_user }}"

        - name: Check if current user has SSH key authentication
          stat:
            path: "{{ user_home }}/.ssh/authorized_keys"
          register: user_ssh_keys
          failed_when: false

        - name: Warn if no SSH keys found and password auth will be disabled
          debug:
            msg: |
              ⚠️  WARNING: Password authentication will be DISABLED, but no SSH keys found for user '{{ current_user }}'!
              
              This could LOCK YOU OUT of the server!
              
              Before continuing:
              1. Make sure you have SSH keys configured: cat ~/.ssh/authorized_keys
              2. Test SSH key login from another terminal
              3. Have console/out-of-band access available
              4. Keep this SSH session open until you verify you can reconnect
              
              If unsure, set hardening_ssh_password_auth: "yes" in vars/hardening.local.yml
            verbosity: 0
          when: not user_ssh_keys.stat.exists or user_ssh_keys.stat.size == 0

        - name: Fail if root user and root login will be disabled
          fail:
            msg: |
              ⚠️  ERROR: You are logged in as root, but hardening will DISABLE root SSH login!
              
              This will LOCK YOU OUT!
              
              Solution:
              1. Create a regular user with sudo access first (run user-management playbook)
              2. Add your SSH key to that user
              3. Then run this hardening playbook
          when: 
            - login_user == "root"
            - (hardening_ssh_permit_root_login | default("no")) == "no"

    - name: Check if SSH hardening is already applied
      when: hardening_ssh_harden | default(true)
      block:
        - name: Get current SSH config values
          shell: |
            echo "PermitRootLogin=$(grep -E '^PermitRootLogin|^#PermitRootLogin' /etc/ssh/sshd_config | tail -1 | sed 's/^#PermitRootLogin/PermitRootLogin/' | awk '{print $2}')"
            echo "PasswordAuthentication=$(grep -E '^PasswordAuthentication|^#PasswordAuthentication' /etc/ssh/sshd_config | tail -1 | sed 's/^#PasswordAuthentication/PasswordAuthentication/' | awk '{print $2}')"
            echo "PubkeyAuthentication=$(grep -E '^PubkeyAuthentication|^#PubkeyAuthentication' /etc/ssh/sshd_config | tail -1 | sed 's/^#PubkeyAuthentication/PubkeyAuthentication/' | awk '{print $2}')"
            echo "MaxAuthTries=$(grep -E '^MaxAuthTries|^#MaxAuthTries' /etc/ssh/sshd_config | tail -1 | sed 's/^#MaxAuthTries/MaxAuthTries/' | awk '{print $2}')"
          register: current_ssh_config
          changed_when: false
          failed_when: false

        - name: Parse current SSH config
          set_fact:
            current_permit_root: "{{ current_ssh_config.stdout | regex_search('PermitRootLogin=([^\\n]+)', '\\1') | default('unknown') }}"
            current_password_auth: "{{ current_ssh_config.stdout | regex_search('PasswordAuthentication=([^\\n]+)', '\\1') | default('unknown') }}"
            current_pubkey_auth: "{{ current_ssh_config.stdout | regex_search('PubkeyAuthentication=([^\\n]+)', '\\1') | default('unknown') }}"
            current_max_auth_tries: "{{ current_ssh_config.stdout | regex_search('MaxAuthTries=([^\\n]+)', '\\1') | default('unknown') }}"

        - name: Check if SSH backup exists
          stat:
            path: /etc/ssh/sshd_config.backup
          register: ssh_backup_exists

        - name: Display pre-check status
          debug:
            msg: |
              ============================================================================
              Pre-Check: SSH Hardening Status
              ============================================================================
              
              Backup exists: {{ 'Yes' if ssh_backup_exists.stat.exists else 'No' }}
              Current PermitRootLogin: {{ current_permit_root }}
              Current PasswordAuthentication: {{ current_password_auth }}
              Current PubkeyAuthentication: {{ current_pubkey_auth }}
              Current MaxAuthTries: {{ current_max_auth_tries }}
              
              Expected PermitRootLogin: {{ hardening_ssh_permit_root_login | default("no") }}
              Expected PasswordAuthentication: {{ hardening_ssh_password_auth | default("no") }}
              
              Status: {{ 'Already hardened' if (current_permit_root == (hardening_ssh_permit_root_login | default("no")) and current_password_auth == (hardening_ssh_password_auth | default("no"))) else 'Needs hardening' }}
              ============================================================================

    - name: Harden SSH configuration
      when: hardening_ssh_harden | default(true)
      block:
        - name: Backup SSH config
          copy:
            src: /etc/ssh/sshd_config
            dest: /etc/ssh/sshd_config.backup
            remote_src: yes
          when: not (hardening_ssh_config_backup | default(true) | bool == false)

        - name: Configure SSH hardening
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            state: present
            backup: yes
          loop:
            - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ hardening_ssh_permit_root_login | default("no") }}' }
            - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ hardening_ssh_password_auth | default("no") }}' }
            - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication {{ hardening_ssh_pubkey_auth | default("yes") }}' }
            - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
            - { regexp: '^#?X11Forwarding', line: 'X11Forwarding {{ hardening_ssh_x11_forwarding | default("no") }}' }
            - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ hardening_ssh_max_auth_tries | default(3) }}' }
            - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ hardening_ssh_client_alive_interval | default(300) }}' }
            - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ hardening_ssh_client_alive_count_max | default(2) }}' }
            - { regexp: '^#?Protocol', line: 'Protocol 2' }
          notify: restart sshd

        - name: Set SSH port if specified
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port'
            line: "Port {{ hardening_ssh_port }}"
            state: present
            backup: yes
          when: hardening_ssh_port is defined
          notify: restart sshd

    - name: Verify SSH hardening configuration
      when: hardening_ssh_harden | default(true)
      block:
        - name: Flush handlers to ensure SSH is restarted
          meta: flush_handlers

        - name: Get actual SSH config values after changes
          shell: |
            echo "PermitRootLogin=$(grep -E '^PermitRootLogin|^#PermitRootLogin' /etc/ssh/sshd_config | tail -1 | sed 's/^#PermitRootLogin/PermitRootLogin/' | awk '{print $2}')"
            echo "PasswordAuthentication=$(grep -E '^PasswordAuthentication|^#PasswordAuthentication' /etc/ssh/sshd_config | tail -1 | sed 's/^#PasswordAuthentication/PasswordAuthentication/' | awk '{print $2}')"
            echo "PubkeyAuthentication=$(grep -E '^PubkeyAuthentication|^#PubkeyAuthentication' /etc/ssh/sshd_config | tail -1 | sed 's/^#PubkeyAuthentication/PubkeyAuthentication/' | awk '{print $2}')"
            echo "MaxAuthTries=$(grep -E '^MaxAuthTries|^#MaxAuthTries' /etc/ssh/sshd_config | tail -1 | sed 's/^#MaxAuthTries/MaxAuthTries/' | awk '{print $2}')"
            echo "X11Forwarding=$(grep -E '^X11Forwarding|^#X11Forwarding' /etc/ssh/sshd_config | tail -1 | sed 's/^#X11Forwarding/X11Forwarding/' | awk '{print $2}')"
          register: verify_ssh_config
          changed_when: false
          failed_when: false

        - name: Parse verified SSH config
          set_fact:
            verified_permit_root: "{{ verify_ssh_config.stdout | regex_search('PermitRootLogin=([^\\n]+)', '\\1') | default('unknown') }}"
            verified_password_auth: "{{ verify_ssh_config.stdout | regex_search('PasswordAuthentication=([^\\n]+)', '\\1') | default('unknown') }}"
            verified_pubkey_auth: "{{ verify_ssh_config.stdout | regex_search('PubkeyAuthentication=([^\\n]+)', '\\1') | default('unknown') }}"
            verified_max_auth_tries: "{{ verify_ssh_config.stdout | regex_search('MaxAuthTries=([^\\n]+)', '\\1') | default('unknown') }}"
            verified_x11: "{{ verify_ssh_config.stdout | regex_search('X11Forwarding=([^\\n]+)', '\\1') | default('unknown') }}"

        - name: Check if SSH service is running
          systemd:
            name: ssh
          register: ssh_service_status
          failed_when: false

        - name: Display verification results
          debug:
            msg: |
              ============================================================================
              Verification: SSH Hardening Configuration
              ============================================================================
              
              SSH Service: {{ '✅ Running' if ssh_service_status.status.ActiveState == 'active' else '❌ Not running' }}
              PermitRootLogin: {{ verified_permit_root }} (expected: {{ hardening_ssh_permit_root_login | default("no") }}) {{ '✅' if verified_permit_root == (hardening_ssh_permit_root_login | default("no")) else '❌' }}
              PasswordAuthentication: {{ verified_password_auth }} (expected: {{ hardening_ssh_password_auth | default("no") }}) {{ '✅' if verified_password_auth == (hardening_ssh_password_auth | default("no")) else '❌' }}
              PubkeyAuthentication: {{ verified_pubkey_auth }} (expected: {{ hardening_ssh_pubkey_auth | default("yes") }}) {{ '✅' if verified_pubkey_auth == (hardening_ssh_pubkey_auth | default("yes")) else '❌' }}
              MaxAuthTries: {{ verified_max_auth_tries }} (expected: {{ hardening_ssh_max_auth_tries | default(3) }}) {{ '✅' if verified_max_auth_tries == (hardening_ssh_max_auth_tries | default(3) | string) else '❌' }}
              X11Forwarding: {{ verified_x11 }} (expected: {{ hardening_ssh_x11_forwarding | default("no") }}) {{ '✅' if verified_x11 == (hardening_ssh_x11_forwarding | default("no")) else '❌' }}
              
              {{ '✅ All SSH hardening settings verified!' if (verified_permit_root == (hardening_ssh_permit_root_login | default("no")) and verified_password_auth == (hardening_ssh_password_auth | default("no")) and ssh_service_status.status.ActiveState == 'active') else '⚠️  Some settings may not match - review configuration' }}
              ============================================================================

    - name: Display summary
      debug:
        msg: |
          ============================================================================
          SSH Hardening Complete
          ============================================================================
          
          SSH config backed up to: /etc/ssh/sshd_config.backup
          Root login: {{ hardening_ssh_permit_root_login | default("no") }}
          Password auth: {{ hardening_ssh_password_auth | default("no") }}
          SSH port: {{ hardening_ssh_port | default("22") }}
          
          ⚠️  Test SSH access from another terminal before closing this session!
          ============================================================================

