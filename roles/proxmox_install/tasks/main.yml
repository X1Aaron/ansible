---
# Proxmox VE Installation Role
# Follows official documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie
# Each step matches the documentation exactly, with individual package installation for debugging

# ============================================================================
# STEP 1: Verify System Requirements
# ============================================================================

- name: Detect OS and version
  block:
    - name: Get OS information
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "$ID|$VERSION_ID"
        elif [ -f /etc/debian_version ]; then
          echo "debian|$(cat /etc/debian_version)"
        else
          echo "unknown|unknown"
        fi
      register: os_info
      changed_when: false
      failed_when: false

    - name: Set OS facts
      set_fact:
        ansible_os_family: "{{ 'Debian' if 'debian' in os_info.stdout else 'Unknown' }}"
        debian_version: "{{ os_info.stdout.split('|')[1] }}"

- name: Verify Debian-based system
  fail:
    msg: "Proxmox VE requires Debian 11, 12, or 13. Detected: {{ ansible_os_family }}"
  when: ansible_os_family != "Debian"

# ============================================================================
# STEP 2: Ensure Hostname Resolves to Hosts IP Address
# Documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie#Ensure_Hostname_Resolves_to_Hosts_IP_Address
# ============================================================================

- name: Verify and fix hostname resolution to non-loopback IP address
  block:
    - name: Get hostname
      command: hostname
      register: system_hostname
      changed_when: false

    - name: Get actual non-loopback IP addresses
      shell: |
        ip -4 addr show | grep 'inet ' | awk '{print $2}' | cut -d/ -f1 | grep -v '^127\.' | head -1
      register: actual_ip
      changed_when: false
      failed_when: false

    - name: Get all non-loopback IPs (fallback method)
      shell: |
        hostname -I | awk '{print $1}'
      register: actual_ip_fallback
      changed_when: false
      failed_when: false
      when: actual_ip.stdout == "" or actual_ip.rc != 0

    - name: Set the actual IP to use
      set_fact:
        detected_ip: "{{ actual_ip.stdout if (actual_ip.stdout | default('') | length > 0) else (actual_ip_fallback.stdout | default('')) }}"

    - name: Read /etc/hosts file for display
      slurp:
        src: /etc/hosts
      register: hosts_file_content
      changed_when: false
      failed_when: false

    - name: Check current hostname resolution
      command: hostname --ip-address
      register: hostname_ip_check
      changed_when: false
      failed_when: false

    - name: Display hostname and network diagnostics
      debug:
        msg: |
          ============================================================================
          Hostname & Network Diagnostics
          ============================================================================
          
          Hostname: {{ system_hostname.stdout }}
          
          Current Hostname Resolution: {{ hostname_ip_check.stdout | default('FAILED - does not resolve') }}
          Detected Network IP Address: {{ detected_ip | default('NOT FOUND') }}
          
          /etc/hosts file contents:
          {{ hosts_file_content.content | b64decode | default('Could not read /etc/hosts') }}
          
          ============================================================================

    - name: Check if resolved IP is loopback
      set_fact:
        is_loopback: "{{ hostname_ip_check.stdout | default('') | regex_search('^(127\\.|::1|^localhost$)') is not none }}"
        has_valid_ip: "{{ hostname_ip_check.stdout | default('') | length > 0 and hostname_ip_check.rc == 0 }}"
        needs_fix: "{{ (not (has_valid_ip | default(false) | bool)) or (is_loopback | default(false) | bool) or (hostname_ip_check.rc != 0) }}"

    - name: Display hostname resolution status
      debug:
        msg: |
          ============================================================================
          Hostname Resolution Check
          ============================================================================
          
          Hostname: {{ system_hostname.stdout }}
          
          Current Resolution: {{ hostname_ip_check.stdout | default('FAILED - does not resolve') }}
          Detected IP Address: {{ detected_ip | default('NOT FOUND') }}
          
          Status: {{ '❌ INVALID (loopback or failed)' if needs_fix | default(false) | bool else '✅ VALID (non-loopback IP)' }}
          
          {% if needs_fix | default(false) | bool %}
          ⚠️  The hostname resolves to a loopback address or doesn't resolve.
          {% if detected_ip | default('') | length > 0 %}
          🔧 Will automatically fix /etc/hosts to use: {{ detected_ip }}
          {% else %}
          ❌ Could not detect a non-loopback IP address. Please configure manually.
          {% endif %}
          {% endif %}
          ============================================================================
      when: needs_fix | default(false) | bool

    - name: Read current /etc/hosts file
      slurp:
        src: /etc/hosts
      register: hosts_file
      when: needs_fix | default(false) | bool and detected_ip | default('') | length > 0

    - name: Fix /etc/hosts to use detected IP
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Proxmox hostname fix"
        block: |
          {{ detected_ip }}  {{ system_hostname.stdout }} {{ system_hostname.stdout }}.local
        insertbefore: "^127\\.0\\.0\\.1"
        create: yes
        backup: yes
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool

    - name: Remove old loopback hostname entries from /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: '^\s*127\.0\.1\.1\s+{{ system_hostname.stdout }}(\s|$)'
        state: absent
        backup: yes
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool

    - name: Verify hostname resolution after fix
      command: hostname --ip-address
      register: hostname_ip_check_after
      changed_when: false
      failed_when: false
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool

    - name: Display fix result
      debug:
        msg: |
          ============================================================================
          Hostname Resolution Fix
          ============================================================================
          
          ✅ Fixed /etc/hosts automatically!
          
          Before: {{ hostname_ip_check.stdout | default('FAILED') }}
          After:  {{ hostname_ip_check_after.stdout | default('CHECKING...') }}
          
          The hostname '{{ system_hostname.stdout }}' now resolves to: {{ hostname_ip_check_after.stdout | default(detected_ip) }}
          ============================================================================
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool
        - hostname_ip_check_after.rc == 0

    - name: Fail if hostname still doesn't resolve correctly and no IP detected
      fail:
        msg: |
          ============================================================================
          Hostname Resolution Error - Manual Fix Required
          ============================================================================
          
          The hostname '{{ system_hostname.stdout }}' must resolve to a non-loopback IP address.
          
          Current resolution: {{ hostname_ip_check.stdout | default('FAILED - hostname does not resolve') }}
          Detected IP address: {{ detected_ip | default('NOT FOUND - could not detect system IP') }}
          
          Could not automatically fix because no non-loopback IP address was detected.
          
          Please manually fix /etc/hosts:
          1. Find your system's IP address: ip addr show | grep "inet " | grep -v "127.0.0.1"
          2. Edit /etc/hosts: sudo nano /etc/hosts
          3. Add or update the line: YOUR_IP_ADDRESS  {{ system_hostname.stdout }} {{ system_hostname.stdout }}.local
          4. Remove any line with: 127.0.1.1  {{ system_hostname.stdout }}
          5. Verify: hostname --ip-address (should return your IP, not 127.x.x.x)
          
          Example /etc/hosts entry:
          192.168.1.100  {{ system_hostname.stdout }} {{ system_hostname.stdout }}.local
          
          See: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie
          ============================================================================
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length == 0

# ============================================================================
# STEP 3: Map Debian version to Proxmox release
# ============================================================================

- name: Map Debian version to Proxmox release
  set_fact:
    proxmox_release_mapped: >-
      {%- if debian_version in ["11", "11.0", "bullseye"] -%}bullseye
      {%- elif debian_version in ["12", "12.0", "bookworm"] -%}bookworm
      {%- elif debian_version in ["13", "13.0", "trixie"] -%}trixie
      {%- else -%}{{ proxmox_release | default('trixie') }}
      {%- endif -%}

- name: Check if Proxmox is already installed
  command: pveversion
  register: proxmox_installed
  changed_when: false
  failed_when: false

# ============================================================================
# STEP 4: Pre-configure packages for non-interactive installation
# ============================================================================

- name: Pre-configure packages for non-interactive installation
  when: proxmox_installed.rc != 0
  block:
    - name: Pre-configure postfix
      debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: 'postfix/main_mailer_type', value: 'Local only', vtype: 'select' }
        - { question: 'postfix/mailname', value: 'localhost', vtype: 'string' }

# ============================================================================
# STEP 5: Clean up old Proxmox repositories (only if not installed)
# ============================================================================

- name: Clean up old Proxmox repositories (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Check for existing Proxmox repositories
      find:
        paths: /etc/apt/sources.list.d
        patterns: "pve*.list,pve*.sources,proxmox*.list,proxmox*.sources"
        file_type: file
      register: existing_repos

    - name: Remove old Proxmox repository files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_repos.files | default([]) }}"
      when: existing_repos.files | length > 0

    - name: Clean problematic entries from sources.list
      lineinfile:
        path: /etc/apt/sources.list
        regexp: '^\s*(deb|deb-src).*proxmox\.com/debian/pve'
        state: absent
      when: existing_repos.files | length > 0

# ============================================================================
# STEP 6: Update system packages (if enabled and not installed)
# Documentation: "apt update && apt full-upgrade"
# ============================================================================

- name: Update system packages (if enabled and not installed)
  when: 
    - proxmox_update_system | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        cache_valid_time: 3600

# ============================================================================
# STEP 7: Install prerequisites (only if not installed)
# ============================================================================

- name: Install prerequisites (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Ensure SSH server is installed (required prerequisite)
      apt:
        name: openssh-server
        state: present
        update_cache: yes
        cache_valid_time: 0

    - name: Install curl (required for GPG key download)
      apt:
        name: curl
        state: present
        update_cache: yes
        cache_valid_time: 0

    - name: Install wget (required for GPG key download)
      apt:
        name: wget
        state: present
        update_cache: yes
        cache_valid_time: 0

    - name: Install gnupg (required for GPG key verification)
      apt:
        name: gnupg
        state: present
        update_cache: yes
        cache_valid_time: 0

    - name: Install ca-certificates (required for HTTPS)
      apt:
        name: ca-certificates
        state: present
        update_cache: yes
        cache_valid_time: 0

# ============================================================================
# STEP 8: Add Proxmox VE Repository
# Documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie#Add_Proxmox_VE_Repository
# ============================================================================

- name: Setup Proxmox repository (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Check if GPG key already exists
      stat:
        path: /usr/share/keyrings/proxmox-archive-keyring.gpg
      register: gpg_key_exists

    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'
      when: not gpg_key_exists.stat.exists

    - name: Download Proxmox GPG key
      get_url:
        url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ proxmox_release_mapped }}.gpg"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
      when: not gpg_key_exists.stat.exists

    - name: Check if repository already configured correctly
      stat:
        path: /etc/apt/sources.list.d/pve-install-repo.sources
      register: repo_file_exists

    - name: Read existing repository config
      slurp:
        src: /etc/apt/sources.list.d/pve-install-repo.sources
      register: existing_repo_config
      when: repo_file_exists.stat.exists
      failed_when: false

    - name: Add Proxmox repository (deb822 format)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_mapped }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        mode: '0644'
      when: >
        (not repo_file_exists.stat.exists) or
        (existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined) or
        (existing_repo_config.content | b64decode | default('') | regex_search('Components:\s*pve-no-subscription') is not defined)

    - name: Update apt cache with Proxmox repository
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: not repo_file_exists.stat.exists or (existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined)

    - name: Full upgrade after adding Proxmox repository (as per Proxmox documentation)
      apt:
        upgrade: dist
        autoremove: yes
        cache_valid_time: 0
      when: not repo_file_exists.stat.exists or (existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined)

    - name: Verify Proxmox packages are available
      command: apt-cache madison proxmox-ve
      register: proxmox_available
      changed_when: false
      failed_when: false

    - name: Fail if Proxmox packages not available
      fail:
        msg: |
          Proxmox packages not found in repository!
          Debian: {{ debian_version }} -> Proxmox: {{ proxmox_release_mapped }}
          Run: apt update && apt-cache search proxmox-ve
      when: proxmox_available.rc != 0 or proxmox_available.stdout_lines | length == 0

# ============================================================================
# STEP 9: Install the Proxmox VE Kernel
# Documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie#Install_the_Proxmox_VE_Kernel
# ============================================================================

- name: Install Proxmox VE Kernel (only if not installed)
  when: 
    - proxmox_install_packages | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Display kernel installation start
      debug:
        msg: |
          ============================================================================
          Installing Proxmox VE Kernel
          ============================================================================
          
          Installing: proxmox-default-kernel
          
          This is required before installing Proxmox VE packages.
          ============================================================================

    - name: Install Proxmox kernel
      apt:
        name: proxmox-default-kernel
        state: present
      register: kernel_install

    - name: Configure kernel package
      command: dpkg --configure -a
      register: kernel_configure
      changed_when: kernel_configure.rc == 0
      failed_when: false
      when: kernel_install.changed | default(false) | bool

    - name: Display kernel installation status
      debug:
        msg: "{{ '✅ Proxmox kernel installed and configured' if kernel_install.changed else 'ℹ️  Proxmox kernel already installed' }}"

# ============================================================================
# STEP 10: Install the Proxmox VE Packages
# Documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie#Install_the_Proxmox_VE_Packages
# Documentation says: "apt install proxmox-ve postfix open-iscsi chrony"
# We install each package separately to identify failures
# ============================================================================

- name: Install Proxmox VE Packages (only if not installed)
  when: 
    - proxmox_install_packages | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Display installation start message
      debug:
        msg: |
          ============================================================================
          Installing Proxmox VE Packages
          ============================================================================
          
          Installing packages individually:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
          
          ⏳ This process may take 10-30 minutes depending on your system and network speed.
          📦 Each package will be installed and configured separately for debugging.
          ============================================================================

    - name: Install proxmox-ve package
      apt:
        name: proxmox-ve
        state: present
      register: proxmox_ve_install

    - name: Configure proxmox-ve package
      command: dpkg --configure -a
      register: proxmox_ve_configure
      changed_when: proxmox_ve_configure.rc == 0
      failed_when: false
      when: proxmox_ve_install.changed | default(false) | bool

    - name: Display proxmox-ve installation status
      debug:
        msg: "{{ '✅ proxmox-ve installed and configured' if proxmox_ve_install.changed else 'ℹ️  proxmox-ve already installed' }}"

    - name: Install postfix package
      apt:
        name: postfix
        state: present
      register: postfix_install

    - name: Configure postfix package
      command: dpkg --configure -a
      register: postfix_configure
      changed_when: postfix_configure.rc == 0
      failed_when: false
      when: postfix_install.changed | default(false) | bool

    - name: Display postfix installation status
      debug:
        msg: "{{ '✅ postfix installed and configured' if postfix_install.changed else 'ℹ️  postfix already installed' }}"

    - name: Install open-iscsi package
      apt:
        name: open-iscsi
        state: present
      register: open_iscsi_install

    - name: Configure open-iscsi package
      command: dpkg --configure -a
      register: open_iscsi_configure
      changed_when: open_iscsi_configure.rc == 0
      failed_when: false
      when: open_iscsi_install.changed | default(false) | bool

    - name: Display open-iscsi installation status
      debug:
        msg: "{{ '✅ open-iscsi installed and configured' if open_iscsi_install.changed else 'ℹ️  open-iscsi already installed' }}"

    - name: Install chrony package
      apt:
        name: chrony
        state: present
      register: chrony_install

    - name: Configure chrony package
      command: dpkg --configure -a
      register: chrony_configure
      changed_when: chrony_configure.rc == 0
      failed_when: false
      when: chrony_install.changed | default(false) | bool

    - name: Display chrony installation status
      debug:
        msg: "{{ '✅ chrony installed and configured' if chrony_install.changed else 'ℹ️  chrony already installed' }}"

    - name: Final package configuration check (catch any remaining unconfigured packages)
      command: dpkg --configure -a
      register: dpkg_final_configure
      changed_when: dpkg_final_configure.rc == 0
      failed_when: false

    - name: Display all packages installation summary
      debug:
        msg: |
          ============================================================================
          ✅ All Proxmox VE packages installation completed!
          ============================================================================
          
          Package Status:
          - proxmox-ve: {{ '✅ Installed' if proxmox_ve_install.changed else 'ℹ️  Already installed' }}
          - postfix: {{ '✅ Installed' if postfix_install.changed else 'ℹ️  Already installed' }}
          - open-iscsi: {{ '✅ Installed' if open_iscsi_install.changed else 'ℹ️  Already installed' }}
          - chrony: {{ '✅ Installed' if chrony_install.changed else 'ℹ️  Already installed' }}
          
          ============================================================================

# ============================================================================
# STEP 11: Ensure SSH service is enabled and started
# ============================================================================

- name: Ensure SSH service is enabled and started
  systemd:
    name: ssh
    enabled: yes
    state: started
  failed_when: false

# ============================================================================
# STEP 12: Fix AppArmor dhclient profile (Hetzner servers only)
# ============================================================================

- name: Fix AppArmor dhclient profile to allow network operations (Hetzner servers)
  block:
    - name: Detect if server is on Hetzner
      block:
        - name: Get server's public IP address
          shell: |
            curl -s --max-time 3 https://api.ipify.org || \
            curl -s --max-time 3 https://icanhazip.com || \
            curl -s --max-time 3 https://ifconfig.me || \
            echo ""
          register: server_public_ip
          changed_when: false
          failed_when: false

        - name: Lookup ASN from IP address (primary method)
          shell: |
            if [ -n "{{ server_public_ip.stdout }}" ]; then
              curl -s --max-time 5 "https://ip-api.com/json/{{ server_public_ip.stdout }}?fields=asn,org" 2>/dev/null | \
              grep -oE '"asn":[0-9]+|"org":"[^"]*"' | \
              grep -i "24940\|213230\|Hetzner" || echo ""
            else
              echo ""
            fi
          register: hetzner_asn_check
          changed_when: false
          failed_when: false
          when: server_public_ip.stdout | default('') | length > 0

        - name: Check apt sources for Hetzner mirrors (fallback)
          shell: |
            grep -r "hetzner\|archive.ubuntu.com\|mirror.hetzner" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -1 || echo ""
          register: hetzner_mirror_check
          changed_when: false
          failed_when: false

        - name: Check hostname for Hetzner indicators (fallback)
          shell: |
            hostname -f 2>/dev/null | grep -i "hetzner\|hz" || echo ""
          register: hetzner_hostname_check
          changed_when: false
          failed_when: false

        - name: Check for Hetzner-specific files/indicators (fallback)
          shell: |
            test -f /etc/hetzner-release 2>/dev/null && echo "hetzner" || \
            grep -q "Hetzner" /etc/motd 2>/dev/null && echo "hetzner" || \
            echo ""
          register: hetzner_file_check
          changed_when: false
          failed_when: false

        - name: Set Hetzner detection fact
          set_fact:
            is_hetzner: >
              {{ (hetzner_asn_check.stdout | default('') | length > 0) or
                 (hetzner_mirror_check.stdout | default('') | length > 0) or
                 (hetzner_hostname_check.stdout | default('') | length > 0) or
                 (hetzner_file_check.stdout | default('') | length > 0) }}

        - name: Display Hetzner detection result
          debug:
            msg: "{{ '✅ Detected Hetzner server - will apply AppArmor fix' if is_hetzner | default(false) | bool else 'ℹ️  Not a Hetzner server - skipping AppArmor fix' }}"

    - name: Check if AppArmor is installed
      command: which apparmor_parser
      register: apparmor_check
      changed_when: false
      failed_when: false
      when: is_hetzner | default(false) | bool

    - name: Check if dhclient AppArmor profile exists
      stat:
        path: /etc/apparmor.d/usr.sbin.dhclient
      register: dhclient_profile
      when:
        - is_hetzner | default(false) | bool
        - apparmor_check.rc == 0

    - name: Fix dhclient AppArmor profile - add unix socket permission
      blockinfile:
        path: /etc/apparmor.d/usr.sbin.dhclient
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Allow unix socket creation (Hetzner fix)"
        block: |
          network unix create type=dgram,
        insertafter: '^\s*network\s+inet\s+'
        backup: yes
      when:
        - is_hetzner | default(false) | bool
        - apparmor_check.rc == 0
        - dhclient_profile.stat.exists
      ignore_errors: yes

    - name: Reload AppArmor profiles
      command: apparmor_parser -r /etc/apparmor.d/usr.sbin.dhclient
      when:
        - is_hetzner | default(false) | bool
        - apparmor_check.rc == 0
        - dhclient_profile.stat.exists
      ignore_errors: yes
      failed_when: false

    - name: Display AppArmor fix status
      debug:
        msg: |
          ============================================================================
          AppArmor dhclient Profile Fix (Hetzner)
          ============================================================================
          {% if is_hetzner | default(false) | bool %}
          {% if apparmor_check.rc == 0 %}
          {% if dhclient_profile.stat.exists %}
          ✅ Fixed AppArmor dhclient profile to allow network operations
          This prevents boot hangs on Hetzner servers.
          {% else %}
          ℹ️  dhclient AppArmor profile not found (may not be needed)
          {% endif %}
          {% else %}
          ℹ️  AppArmor not installed (no fix needed)
          {% endif %}
          {% else %}
          ℹ️  Not a Hetzner server - AppArmor fix skipped
          {% endif %}
          ============================================================================

# ============================================================================
# STEP 13: Remove the Debian Kernel
# Documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie#Remove_the_Debian_Kernel
# Documentation says: "apt remove linux-image-amd64 'linux-image-6.12*'"
# ============================================================================

- name: Remove the Debian Kernel (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Get installed Debian kernels
      shell: dpkg -l | grep -E '^ii.*linux-image-(amd64|6\.12)' | awk '{print $2}' || true
      register: debian_kernels
      changed_when: false
      failed_when: false

    - name: Remove Debian kernels
      apt:
        name: "{{ debian_kernels.stdout_lines + ['linux-image-amd64'] }}"
        state: absent
      when: debian_kernels.stdout_lines | length > 0
      failed_when: false

    - name: Update GRUB after kernel removal
      command: update-grub
      changed_when: false
      failed_when: false
      when: debian_kernels.stdout_lines | length > 0

# ============================================================================
# STEP 14: Remove the os-prober Package
# Documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie#Remove_the_os-prober_Package
# Documentation says: "apt remove os-prober"
# ============================================================================

- name: Remove os-prober package
  apt:
    name: os-prober
    state: absent
  failed_when: false

# ============================================================================
# STEP 15: Verify installation
# ============================================================================

- name: Verify installation
  command: pveversion
  register: proxmox_version
  changed_when: false
  failed_when: false

- name: Display Proxmox version
  debug:
    msg: "Proxmox VE {{ proxmox_version.stdout }} installed successfully"
  when: proxmox_version.rc == 0

# ============================================================================
# STEP 16: Handle reboot after installation
# ============================================================================

- name: Handle reboot after installation
  when: proxmox_reboot_after_install | default(true)
  block:
    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_file
      changed_when: false

    - name: Prompt for reboot
      pause:
        prompt: |
          ============================================================================
          {% if reboot_file.stat.exists %}
          ⚠️  Reboot Required
          ============================================================================
          
          A reboot is required to complete the Proxmox VE installation.
          {% else %}
          🔄 Optional Reboot
          ============================================================================
          
          Proxmox VE installation is complete. While not strictly required,
          a reboot is recommended to ensure all changes take effect.
          {% endif %}
          
          Do you want to reboot now? (yes/no)
          ============================================================================
        echo: yes
      register: reboot_prompt

    - name: Reboot system (using reboot module)
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
      when:
        - reboot_prompt.user_input | default('no') | lower == 'yes'
        - inventory_hostname != 'localhost'
      ignore_errors: yes

    - name: Reboot system (localhost - using command)
      command: shutdown -r +1 "Rebooting after Proxmox VE installation"
      async: 1
      poll: 0
      when:
        - reboot_prompt.user_input | default('no') | lower == 'yes'
        - inventory_hostname == 'localhost'
      ignore_errors: yes

    - name: Display reboot message for localhost
      debug:
        msg: |
          ============================================================================
          🔄 System will reboot in 1 minute
          ============================================================================
          
          The system is scheduled to reboot in 1 minute.
          To cancel: sudo shutdown -c
          ============================================================================
      when:
        - reboot_prompt.user_input | default('no') | lower == 'yes'
        - inventory_hostname == 'localhost'

    - name: Remind to reboot manually
      debug:
        msg: |
          ============================================================================
          {% if reboot_file.stat.exists %}
          ⚠️  Reboot Required
          ============================================================================
          
          Please reboot manually to complete the installation:
          $ sudo reboot
          {% else %}
          ℹ️  Reboot Skipped
          ============================================================================
          
          Installation complete. You can reboot later if needed:
          $ sudo reboot
          {% endif %}
          ============================================================================
      when: reboot_prompt.user_input | default('no') | lower != 'yes'

# ============================================================================
# STEP 17: Display installation summary
# ============================================================================

- name: Display installation summary
  block:
    - name: Check Proxmox version for summary
      command: pveversion
      register: proxmox_version_summary
      changed_when: false
      failed_when: false

    - name: Display installation summary
      debug:
        msg: |
          ============================================================================
          Proxmox VE Installation {{ 'Complete' if (proxmox_version_summary.rc | default(1) == 0) else 'Ready' }}!
          ============================================================================
          {% if proxmox_installed.rc == 0 %}
          Status: Already installed ({{ proxmox_version_summary.stdout | default('version unknown') }})
          {% elif proxmox_version_summary.rc | default(1) == 0 %}
          Status: Installation completed successfully
          Version: {{ proxmox_version_summary.stdout | default('version unknown') }}
          {% else %}
          Status: Installation in progress or failed
          {% endif %}
          
          Next Steps:
          
          {% if proxmox_installed.rc != 0 %}
          1. Reboot the system (if required)
             $ sudo reboot
          {% endif %}
          
          2. Access the Web Interface
             URL: https://{{ inventory_hostname }}:8006
             Login: root / (your root password)
          
          3. Configure Proxmox (use separate playbooks for network, storage, etc.)
             - Set up storage
             - Configure network bridges
             - Create virtual machines/containers
          
          Documentation: https://pve.proxmox.com/pve-docs/
          ============================================================================
