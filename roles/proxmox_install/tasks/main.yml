---
# Detect OS and version
- name: Detect OS family and version
  block:
    - name: Get OS information
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "$ID|$VERSION_ID"
        elif [ -f /etc/debian_version ]; then
          echo "debian|$(cat /etc/debian_version)"
        else
          echo "unknown|unknown"
        fi
      register: os_info
      changed_when: false
      failed_when: false

    - name: Set OS facts
      set_fact:
        ansible_os_family: "{{ 'Debian' if 'debian' in os_info.stdout else 'Unknown' }}"
        debian_version: "{{ os_info.stdout.split('|')[1] }}"

- name: Verify Debian-based system
  fail:
    msg: "Proxmox VE requires Debian 11, 12, or 13. Detected: {{ ansible_os_family }}"
  when: ansible_os_family != "Debian"

- name: Map Debian version to Proxmox release
  set_fact:
    proxmox_release_mapped: >-
      {%- if debian_version in ["11", "11.0", "bullseye"] -%}bullseye
      {%- elif debian_version in ["12", "12.0", "bookworm"] -%}bookworm
      {%- elif debian_version in ["13", "13.0", "trixie"] -%}trixie
      {%- else -%}{{ proxmox_release | default('trixie') }}
      {%- endif -%}

- name: Warn about unsupported Debian version
  debug:
    msg: "WARNING: Debian {{ debian_version }} may not be fully supported. Using Proxmox release: {{ proxmox_release_mapped }}"
  when: debian_version not in ["11", "12", "13", "bullseye", "bookworm", "trixie", "11.0", "12.0", "13.0"]

# Clean up old Proxmox repositories
- name: Clean up old Proxmox repositories
  block:
    - name: Remove old Proxmox repository files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/pve.list
        - /etc/apt/sources.list.d/pve-install-repo.sources
        - /etc/apt/sources.list.d/proxmox-ve.list
        - /etc/apt/sources.list.d/pve-no-subscription.list

    - name: Remove repository files with wrong configuration
      shell: |
        for file in /etc/apt/sources.list.d/pve*.sources /etc/apt/sources.list.d/pve*.list /etc/apt/sources.list.d/proxmox*.list /etc/apt/sources.list.d/proxmox*.sources; do
          [ -f "$file" ] || continue
          if grep -qE "Components:\s*pve[^-]" "$file" 2>/dev/null || \
             grep -qE "pve\s+pve[^-]" "$file" 2>/dev/null || \
             grep -qE "https?://enterprise\.proxmox\.com/debian/pve" "$file" 2>/dev/null; then
            rm -f "$file" && echo "removed:$file"
          fi
        done
        if [ -f /etc/apt/sources.list ] && grep -qE "(enterprise|download)\.proxmox\.com/debian/pve" /etc/apt/sources.list 2>/dev/null; then
          sed -i '/\(enterprise\|download\)\.proxmox\.com\/debian\/pve/s/^/# /' /etc/apt/sources.list && echo "commented:/etc/apt/sources.list"
        fi
      register: cleanup_result
      changed_when: "'removed:' in cleanup_result.stdout or 'commented:' in cleanup_result.stdout"
      failed_when: false

# Update system (if enabled)
- name: Update system packages
  when: proxmox_update_system | default(true)
  block:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        cache_valid_time: 3600

# Install prerequisites
- name: Install prerequisites
  apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes
    cache_valid_time: 3600

# Setup Proxmox repository
- name: Setup Proxmox repository
  block:
    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download Proxmox GPG key
      get_url:
        url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ proxmox_release_mapped }}.gpg"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
      register: gpg_download

    - name: Fail if GPG key download failed
      fail:
        msg: "Failed to download Proxmox GPG key. Check network connectivity."
      when: gpg_download.failed

    - name: Add Proxmox repository (deb822 format)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_mapped }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        mode: '0644'

    - name: Update apt cache with Proxmox repository
      apt:
        update_cache: yes
        cache_valid_time: 0
      register: apt_update

    - name: Verify Proxmox packages are available
      command: apt-cache madison proxmox-ve
      register: proxmox_available
      changed_when: false
      failed_when: false

    - name: Fail if Proxmox packages not available
      fail:
        msg: |
          Proxmox packages not found in repository!
          Debian: {{ debian_version }} -> Proxmox: {{ proxmox_release_mapped }}
          Run: apt update && apt-cache search proxmox-ve
      when: proxmox_available.rc != 0 or proxmox_available.stdout_lines | length == 0

# Install Proxmox VE
- name: Install Proxmox VE
  when: proxmox_install_packages | default(true)
  block:
    - name: Check if Proxmox is already installed
      command: pveversion
      register: proxmox_installed
      changed_when: false
      failed_when: false

    - name: Pre-configure postfix
      debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: 'postfix/main_mailer_type', value: 'Local only', vtype: 'select' }
        - { question: 'postfix/mailname', value: '{{ proxmox_hostname | default(inventory_hostname) }}', vtype: 'string' }
      when: proxmox_installed.rc != 0

    - name: Install Proxmox kernel first
      apt:
        name: proxmox-default-kernel
        state: present
        environment:
          DEBIAN_FRONTEND: noninteractive
      when: proxmox_installed.rc != 0

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
        environment:
          DEBIAN_FRONTEND: noninteractive
      when: proxmox_installed.rc != 0

    - name: Get installed Debian kernels
      shell: dpkg -l | grep -E '^ii.*linux-image-(amd64|6\.12)' | awk '{print $2}'
      register: debian_kernels
      changed_when: false
      failed_when: false
      when: proxmox_installed.rc == 0

    - name: Remove Debian kernels
      apt:
        name: "{{ debian_kernels.stdout_lines + ['linux-image-amd64'] }}"
        state: absent
      when:
        - proxmox_installed.rc == 0
        - debian_kernels.stdout_lines | length > 0

    - name: Update GRUB
      command: update-grub
      changed_when: false
      failed_when: false
      when: proxmox_installed.rc == 0

    - name: Remove os-prober
      apt:
        name: os-prober
        state: absent
      when: proxmox_installed.rc == 0

    - name: Verify installation
      command: pveversion
      register: proxmox_version
      changed_when: false
      failed_when: false

    - name: Display Proxmox version
      debug:
        msg: "Proxmox VE {{ proxmox_version.stdout }} installed successfully"
      when: proxmox_version.rc == 0

# Configure Proxmox (optional)
- name: Configure Proxmox
  when: proxmox_configure | default(true)
  block:
    - name: Set hostname
      hostname:
        name: "{{ proxmox_hostname }}"
      when: proxmox_hostname is defined

    - name: Configure network
      template:
        src: interfaces.j2
        dest: /etc/network/interfaces
        backup: yes
      when:
        - proxmox_network_config is defined
        - proxmox_network_config | length > 0
      ignore_errors: yes

# Reboot handling
- name: Handle reboot
  when: proxmox_reboot_after_install | default(true)
  block:
    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_file

    - name: Prompt for reboot
      pause:
        prompt: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          A reboot is required to complete the Proxmox VE installation.
          
          Do you want to reboot now? (yes/no)
          ============================================================================
        echo: yes
      register: reboot_prompt
      when: reboot_file.stat.exists

    - name: Reboot system
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
      when:
        - reboot_file.stat.exists
        - reboot_prompt.user_input | default('no') | lower == 'yes'
      ignore_errors: yes

    - name: Remind to reboot manually
      debug:
        msg: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          Please reboot manually: sudo reboot
          ============================================================================
      when:
        - reboot_file.stat.exists
        - reboot_prompt.user_input | default('no') | lower != 'yes'

# Installation summary
- name: Display installation summary
  debug:
    msg: |
      ============================================================================
      Proxmox VE Installation Complete!
      ============================================================================
      
      Next Steps:
      
      1. Reboot the system (if required)
         $ sudo reboot
      
      2. Access the Web Interface
         URL: https://{{ proxmox_hostname | default(inventory_hostname) }}:8006
         Login: root / (your root password)
      
      3. Configure Proxmox
         - Set up storage
         - Configure network bridges
         - Create virtual machines/containers
      
      Important Notes:
      - If you changed the hostname, ensure DNS is configured correctly
      - The hostname must resolve to a non-loopback IP address
      - Check /etc/hosts if hostname resolution fails
      
      Documentation: https://pve.proxmox.com/pve-docs/
      ============================================================================
