---
- name: Detect OS family
  block:
    - name: Detect OS family
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              echo "Debian"
              ;;
            rhel|centos|fedora|rocky|almalinux)
              echo "RedHat"
              ;;
            *)
              echo "Unknown"
              ;;
          esac
        elif [ -f /etc/redhat-release ]; then
          echo "RedHat"
        elif [ -f /etc/debian_version ]; then
          echo "Debian"
        else
          echo "Unknown"
        fi
      register: os_family_result
      changed_when: false
      failed_when: false

    - name: Set OS family fact
      set_fact:
        ansible_os_family: "{{ os_family_result.stdout }}"

- name: Check if running on Debian-based system
  fail:
    msg: "Proxmox VE can only be installed on Debian-based systems (Debian 11/12)"
  when: ansible_os_family != "Debian"

- name: Detect Debian version
  shell: |
    if [ -f /etc/os-release ]; then
      . /etc/os-release
      echo "$VERSION_ID"
    elif [ -f /etc/debian_version ]; then
      cat /etc/debian_version
    else
      echo "unknown"
    fi
  register: debian_version_result
  changed_when: false
  failed_when: false

- name: Set Debian version fact
  set_fact:
    debian_version: "{{ debian_version_result.stdout }}"

- name: Warn if not Debian 11, 12, or 13
  debug:
    msg: |
      ⚠️  WARNING: Proxmox VE officially supports Debian 11 (Bullseye), Debian 12 (Bookworm), and Debian 13 (Trixie).
      Detected version: {{ debian_version }}
      Proceeding anyway, but installation may fail.
    verbosity: 1
  when: debian_version not in ["11", "12", "13", "bullseye", "bookworm", "trixie", "11.0", "12.0", "13.0"]

- name: Update system packages
  when: proxmox_update_system | default(true)
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Add Proxmox VE repository
  block:
    - name: Add Proxmox VE repository key
      apt_key:
        url: "https://enterprise.proxmox.com/debian/proxmox-release-{{ proxmox_release | default('bookworm') }}.gpg"
        state: present
      ignore_errors: yes

    - name: Add Proxmox VE repository (alternative method)
      shell: |
        wget -qO- "https://enterprise.proxmox.com/debian/proxmox-release-{{ proxmox_release | default('bookworm') }}.gpg" | gpg --dearmor -o /etc/apt/trusted.gpg.d/proxmox-release.gpg
      when: ansible_facts.get('ansible_apt_key_installed', false) == false
      ignore_errors: yes

    - name: Add Proxmox VE repository to sources.list (no-subscription)
      apt_repository:
        repo: "deb [arch=amd64] http://download.proxmox.com/debian/pve {{ proxmox_release | default('bookworm') }} pve-no-subscription"
        state: present
        filename: proxmox-ve
        update_cache: yes

- name: Switch to community free repository after installation
  when: proxmox_switch_to_community | default(true)
  block:
    - name: Remove enterprise repository
      apt_repository:
        repo: "deb [arch=amd64] http://download.proxmox.com/debian/pve {{ proxmox_release | default('bookworm') }} pve-no-subscription"
        state: absent
        filename: proxmox-ve

    - name: Add community free repository
      apt_repository:
        repo: "deb [arch=amd64] http://download.proxmox.com/debian/ceph-quincy {{ proxmox_release | default('bookworm') }} no-subscription"
        state: present
        filename: proxmox-community-ceph
        update_cache: yes
      ignore_errors: yes

    - name: Add Proxmox VE community repository
      apt_repository:
        repo: "deb [arch=amd64] http://download.proxmox.com/debian/pve {{ proxmox_release | default('bookworm') }} pve"
        state: present
        filename: proxmox-community-pve
        update_cache: yes

    - name: Remove subscription warning (optional)
      lineinfile:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent
      ignore_errors: yes

    - name: Create no-subscription file to disable enterprise repo
      copy:
        content: "# Community repository - no subscription required\n"
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        mode: '0644'
      ignore_errors: yes

- name: Install Proxmox VE
  when: proxmox_install_packages | default(true)
  block:
    - name: Update apt cache after adding repository
      apt:
        update_cache: yes

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - pve-kernel-6.2
          - postfix
        state: present

    - name: Remove os-prober (if present)
      apt:
        name: os-prober
        state: absent
      ignore_errors: yes

- name: Configure Proxmox
  when: proxmox_configure | default(true)
  block:
    - name: Set hostname (if specified)
      hostname:
        name: "{{ proxmox_hostname }}"
      when: proxmox_hostname is defined

    - name: Configure network (if specified)
      block:
        - name: Backup network configuration
          copy:
            src: /etc/network/interfaces
            dest: /etc/network/interfaces.backup
            remote_src: yes
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Configure network interfaces
          template:
            src: interfaces.j2
            dest: /etc/network/interfaces
            backup: yes
          when: 
            - proxmox_network_config is defined
            - proxmox_network_config | length > 0
          ignore_errors: yes
      when: proxmox_network_config is defined

- name: Reboot system (if required)
  when: proxmox_reboot_after_install | default(true)
  block:
    - name: Check if reboot is required
      shell: test -f /var/run/reboot-required && echo "yes" || echo "no"
      register: reboot_required
      changed_when: false
      failed_when: false

    - name: Reboot system
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
      when: reboot_required.stdout == "yes"

- name: Display installation summary
  debug:
    msg: |
      ✅ Proxmox VE installation completed!
      
      Next steps:
      1. Reboot the system if required
      2. Access the web interface at: https://{{ proxmox_hostname | default(ansible_hostname) }}:8006
      3. Login with root credentials
      4. Configure your storage and network settings
      
      Note: If you changed the hostname, make sure DNS is configured correctly.

