---
# Proxmox VE Installation Role
# Optimized for fresh VM installation - fully automated and idempotent

- name: Detect OS and version
  block:
    - name: Get OS information
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "$ID|$VERSION_ID"
        elif [ -f /etc/debian_version ]; then
          echo "debian|$(cat /etc/debian_version)"
        else
          echo "unknown|unknown"
        fi
      register: os_info
      changed_when: false
      failed_when: false

    - name: Set OS facts
      set_fact:
        ansible_os_family: "{{ 'Debian' if 'debian' in os_info.stdout else 'Unknown' }}"
        debian_version: "{{ os_info.stdout.split('|')[1] }}"

- name: Verify Debian-based system
  fail:
    msg: "Proxmox VE requires Debian 11, 12, or 13. Detected: {{ ansible_os_family }}"
  when: ansible_os_family != "Debian"

- name: Verify and fix hostname resolution to non-loopback IP address
  block:
    - name: Get hostname
      command: hostname
      register: system_hostname
      changed_when: false

    - name: Get actual non-loopback IP addresses
      shell: |
        ip -4 addr show | grep 'inet ' | awk '{print $2}' | cut -d/ -f1 | grep -v '^127\.' | head -1
      register: actual_ip
      changed_when: false
      failed_when: false

    - name: Get all non-loopback IPs (fallback method)
      shell: |
        hostname -I | awk '{print $1}'
      register: actual_ip_fallback
      changed_when: false
      failed_when: false
      when: actual_ip.stdout == "" or actual_ip.rc != 0

    - name: Set the actual IP to use
      set_fact:
        detected_ip: "{{ (actual_ip.stdout | default('')) | length > 0 | ternary(actual_ip.stdout, actual_ip_fallback.stdout | default('')) }}"

    - name: Read /etc/hosts file for display
      slurp:
        src: /etc/hosts
      register: hosts_file_content
      changed_when: false
      failed_when: false

    - name: Check current hostname resolution
      command: hostname --ip-address
      register: hostname_ip_check
      changed_when: false
      failed_when: false

    - name: Display hostname and network diagnostics
      debug:
        msg: |
          ============================================================================
          Hostname & Network Diagnostics
          ============================================================================
          
          Hostname: {{ system_hostname.stdout }}
          
          Current Hostname Resolution: {{ hostname_ip_check.stdout | default('FAILED - does not resolve') }}
          Detected Network IP Address: {{ detected_ip | default('NOT FOUND') }}
          
          /etc/hosts file contents:
          {{ hosts_file_content.content | b64decode | default('Could not read /etc/hosts') }}
          
          ============================================================================

    - name: Check if resolved IP is loopback
      set_fact:
        is_loopback: "{{ hostname_ip_check.stdout | default('') | regex_search('^(127\\.|::1|^localhost$)') is not none }}"
        has_valid_ip: "{{ hostname_ip_check.stdout | default('') | length > 0 and hostname_ip_check.rc == 0 }}"
        needs_fix: "{{ (not (has_valid_ip | default(false) | bool)) or (is_loopback | default(false) | bool) or (hostname_ip_check.rc != 0) }}"

    - name: Display hostname resolution status
      debug:
        msg: |
          ============================================================================
          Hostname Resolution Check
          ============================================================================
          
          Hostname: {{ system_hostname.stdout }}
          
          Current Resolution: {{ hostname_ip_check.stdout | default('FAILED - does not resolve') }}
          Detected IP Address: {{ detected_ip | default('NOT FOUND') }}
          
          Status: {{ '❌ INVALID (loopback or failed)' if needs_fix | default(false) | bool else '✅ VALID (non-loopback IP)' }}
          
          {% if needs_fix | default(false) | bool %}
          ⚠️  The hostname resolves to a loopback address or doesn't resolve.
          {% if detected_ip | default('') | length > 0 %}
          🔧 Will automatically fix /etc/hosts to use: {{ detected_ip }}
          {% else %}
          ❌ Could not detect a non-loopback IP address. Please configure manually.
          {% endif %}
          {% endif %}
          ============================================================================
      when: needs_fix | default(false) | bool

    - name: Read current /etc/hosts file
      slurp:
        src: /etc/hosts
      register: hosts_file
      when: needs_fix | default(false) | bool and detected_ip | default('') | length > 0

    - name: Fix /etc/hosts to use detected IP
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Proxmox hostname fix"
        block: |
          {{ detected_ip }}  {{ system_hostname.stdout }} {{ system_hostname.stdout }}.local
        insertbefore: "^127\\.0\\.0\\.1"
        create: yes
        backup: yes
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool

    - name: Remove old loopback hostname entries from /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: "^\s*127\.0\.1\.1\s+{{ system_hostname.stdout }}(\s|$)"
        state: absent
        backup: yes
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool

    - name: Verify hostname resolution after fix
      command: hostname --ip-address
      register: hostname_ip_check_after
      changed_when: false
      failed_when: false
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool

    - name: Display fix result
      debug:
        msg: |
          ============================================================================
          Hostname Resolution Fix
          ============================================================================
          
          ✅ Fixed /etc/hosts automatically!
          
          Before: {{ hostname_ip_check.stdout | default('FAILED') }}
          After:  {{ hostname_ip_check_after.stdout | default('CHECKING...') }}
          
          The hostname '{{ system_hostname.stdout }}' now resolves to: {{ hostname_ip_check_after.stdout | default(detected_ip) }}
          ============================================================================
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length > 0
        - is_loopback | default(false) | bool
        - hostname_ip_check_after.rc == 0

    - name: Fail if hostname still doesn't resolve correctly and no IP detected
      fail:
        msg: |
          ============================================================================
          Hostname Resolution Error - Manual Fix Required
          ============================================================================
          
          The hostname '{{ system_hostname.stdout }}' must resolve to a non-loopback IP address.
          
          Current resolution: {{ hostname_ip_check.stdout | default('FAILED - hostname does not resolve') }}
          Detected IP address: {{ detected_ip | default('NOT FOUND - could not detect system IP') }}
          
          Could not automatically fix because no non-loopback IP address was detected.
          
          Please manually fix /etc/hosts:
          1. Find your system's IP address: ip addr show | grep "inet " | grep -v "127.0.0.1"
          2. Edit /etc/hosts: sudo nano /etc/hosts
          3. Add or update the line: YOUR_IP_ADDRESS  {{ system_hostname.stdout }} {{ system_hostname.stdout }}.local
          4. Remove any line with: 127.0.1.1  {{ system_hostname.stdout }}
          5. Verify: hostname --ip-address (should return your IP, not 127.x.x.x)
          
          Example /etc/hosts entry:
          192.168.1.100  {{ system_hostname.stdout }} {{ system_hostname.stdout }}.local
          
          See: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie
          ============================================================================
      when:
        - needs_fix | default(false) | bool
        - detected_ip | default('') | length == 0

- name: Map Debian version to Proxmox release
  set_fact:
    proxmox_release_mapped: >-
      {%- if debian_version in ["11", "11.0", "bullseye"] -%}bullseye
      {%- elif debian_version in ["12", "12.0", "bookworm"] -%}bookworm
      {%- elif debian_version in ["13", "13.0", "trixie"] -%}trixie
      {%- else -%}{{ proxmox_release | default('trixie') }}
      {%- endif -%}

- name: Check if Proxmox is already installed
  command: pveversion
  register: proxmox_installed
  changed_when: false
  failed_when: false

- name: Pre-configure packages for non-interactive installation
  when: proxmox_installed.rc != 0
  block:
    - name: Pre-configure postfix
      debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: 'postfix/main_mailer_type', value: 'Local only', vtype: 'select' }
        - { question: 'postfix/mailname', value: 'localhost', vtype: 'string' }

- name: Clean up old Proxmox repositories (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Check for existing Proxmox repositories
      find:
        paths: /etc/apt/sources.list.d
        patterns: "pve*.list,pve*.sources,proxmox*.list,proxmox*.sources"
        file_type: file
      register: existing_repos

    - name: Remove old Proxmox repository files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_repos.files | default([]) }}"
      when: existing_repos.files | length > 0

    - name: Clean problematic entries from sources.list
      lineinfile:
        path: /etc/apt/sources.list
        regexp: '^\s*(deb|deb-src).*proxmox\.com/debian/pve'
        state: absent
      when: existing_repos.files | length > 0

- name: Update system packages (if enabled and not installed)
  when: 
    - proxmox_update_system | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        cache_valid_time: 3600

- name: Install prerequisites (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Ensure SSH server is installed (required prerequisite)
      apt:
        name: openssh-server
        state: present
        update_cache: yes
        cache_valid_time: 0

    - name: Install other prerequisites
      apt:
        name:
          - curl
          - wget
          - gnupg
          - ca-certificates
        state: present
        update_cache: yes
        cache_valid_time: 0

- name: Setup Proxmox repository (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Check if GPG key already exists
      stat:
        path: /usr/share/keyrings/proxmox-archive-keyring.gpg
      register: gpg_key_exists

    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'
      when: not gpg_key_exists.stat.exists

    - name: Download Proxmox GPG key
      get_url:
        url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ proxmox_release_mapped }}.gpg"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
      when: not gpg_key_exists.stat.exists

    - name: Check if repository already configured correctly
      stat:
        path: /etc/apt/sources.list.d/pve-install-repo.sources
      register: repo_file_exists

    - name: Read existing repository config
      slurp:
        src: /etc/apt/sources.list.d/pve-install-repo.sources
      register: existing_repo_config
      when: repo_file_exists.stat.exists
      failed_when: false

    - name: Add Proxmox repository (deb822 format)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_mapped }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        mode: '0644'
      when: 
        - not repo_file_exists.stat.exists
        - or
        - existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined
        - existing_repo_config.content | b64decode | default('') | regex_search('Components:\s*pve-no-subscription') is not defined

    - name: Update apt cache with Proxmox repository
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: not repo_file_exists.stat.exists or (existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined)

    - name: Full upgrade after adding Proxmox repository (as per Proxmox documentation)
      apt:
        upgrade: dist
        autoremove: yes
        cache_valid_time: 0
      when: not repo_file_exists.stat.exists or (existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined)

    - name: Verify Proxmox packages are available
      command: apt-cache madison proxmox-ve
      register: proxmox_available
      changed_when: false
      failed_when: false

    - name: Fail if Proxmox packages not available
      fail:
        msg: |
          Proxmox packages not found in repository!
          Debian: {{ debian_version }} -> Proxmox: {{ proxmox_release_mapped }}
          Run: apt update && apt-cache search proxmox-ve
      when: proxmox_available.rc != 0 or proxmox_available.stdout_lines | length == 0

- name: Install Proxmox VE (only if not installed)
  when: 
    - proxmox_install_packages | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Install Proxmox kernel first
      apt:
        name: proxmox-default-kernel
        state: present

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present

    - name: Ensure SSH service is enabled and started
      systemd:
        name: ssh
        enabled: yes
        state: started
      failed_when: false

    - name: Remove os-prober
      apt:
        name: os-prober
        state: absent
      failed_when: false

    - name: Get installed Debian kernels
      shell: dpkg -l | grep -E '^ii.*linux-image-(amd64|6\.12)' | awk '{print $2}' || true
      register: debian_kernels
      changed_when: false
      failed_when: false

    - name: Remove Debian kernels
      apt:
        name: "{{ debian_kernels.stdout_lines + ['linux-image-amd64'] }}"
        state: absent
      when: debian_kernels.stdout_lines | length > 0
      failed_when: false

    - name: Update GRUB after kernel removal
      command: update-grub
      changed_when: false
      failed_when: false
      when: debian_kernels.stdout_lines | length > 0

    - name: Verify installation
      command: pveversion
      register: proxmox_version
      changed_when: false
      failed_when: false

    - name: Display Proxmox version
      debug:
        msg: "Proxmox VE {{ proxmox_version.stdout }} installed successfully"
      when: proxmox_version.rc == 0

- name: Handle reboot (only if installation was performed)
  when: 
    - proxmox_reboot_after_install | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_file

    - name: Prompt for reboot
      pause:
        prompt: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          A reboot is required to complete the Proxmox VE installation.
          
          Do you want to reboot now? (yes/no)
          ============================================================================
        echo: yes
      register: reboot_prompt
      when: reboot_file.stat.exists

    - name: Reboot system
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
      when:
        - reboot_file.stat.exists
        - reboot_prompt.user_input | default('no') | lower == 'yes'
      ignore_errors: yes

    - name: Remind to reboot manually
      debug:
        msg: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          Please reboot manually: sudo reboot
          ============================================================================
      when:
        - reboot_file.stat.exists
        - reboot_prompt.user_input | default('no') | lower != 'yes'

- name: Display installation summary
  debug:
    msg: |
      ============================================================================
      Proxmox VE Installation {{ 'Complete' if proxmox_version.rc == 0 else 'Ready' }}!
      ============================================================================
      {% if proxmox_installed.rc == 0 %}
      Status: Already installed ({{ proxmox_version.stdout | default('version unknown') }})
      {% elif proxmox_version.rc == 0 %}
      Status: Installation completed successfully
      Version: {{ proxmox_version.stdout | default('version unknown') }}
      {% else %}
      Status: Installation in progress or failed
      {% endif %}
      
      Next Steps:
      
      {% if proxmox_installed.rc != 0 %}
      1. Reboot the system (if required)
         $ sudo reboot
      {% endif %}
      
      2. Access the Web Interface
         URL: https://{{ inventory_hostname }}:8006
         Login: root / (your root password)
      
      3. Configure Proxmox (use separate playbooks for network, storage, etc.)
         - Set up storage
         - Configure network bridges
         - Create virtual machines/containers
      
      Documentation: https://pve.proxmox.com/pve-docs/
      ============================================================================
