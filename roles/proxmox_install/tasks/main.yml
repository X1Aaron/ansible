---
- name: Detect OS family
  block:
    - name: Detect OS family
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              echo "Debian"
              ;;
            rhel|centos|fedora|rocky|almalinux)
              echo "RedHat"
              ;;
            *)
              echo "Unknown"
              ;;
          esac
        elif [ -f /etc/redhat-release ]; then
          echo "RedHat"
        elif [ -f /etc/debian_version ]; then
          echo "Debian"
        else
          echo "Unknown"
        fi
      register: os_family_result
      changed_when: false
      failed_when: false

    - name: Set OS family fact
      set_fact:
        ansible_os_family: "{{ os_family_result.stdout }}"

- name: Check if running on Debian-based system
  fail:
    msg: "Proxmox VE can only be installed on Debian-based systems (Debian 11/12)"
  when: ansible_os_family != "Debian"

- name: Detect Debian version
  shell: |
    if [ -f /etc/os-release ]; then
      . /etc/os-release
      echo "$VERSION_ID"
    elif [ -f /etc/debian_version ]; then
      cat /etc/debian_version
    else
      echo "unknown"
    fi
  register: debian_version_result
  changed_when: false
  failed_when: false

- name: Set Debian version fact
  set_fact:
    debian_version: "{{ debian_version_result.stdout }}"

- name: Map Debian version to Proxmox release name
  set_fact:
    proxmox_release_mapped: >-
      {%- if debian_version in ["11", "11.0", "bullseye"] -%}
        bullseye
      {%- elif debian_version in ["12", "12.0", "bookworm"] -%}
        bookworm
      {%- elif debian_version in ["13", "13.0", "trixie"] -%}
        trixie
      {%- else -%}
        {{ proxmox_release | default('trixie') }}
      {%- endif -%}

- name: Warn if not Debian 11, 12, or 13
  debug:
    msg: |
      ⚠️  WARNING: Proxmox VE officially supports Debian 11 (Bullseye), Debian 12 (Bookworm), and Debian 13 (Trixie).
      Detected version: {{ debian_version }}
      Using Proxmox release: {{ proxmox_release_mapped }}
      Proceeding anyway, but installation may fail.
  when: debian_version not in ["11", "12", "13", "bullseye", "bookworm", "trixie", "11.0", "12.0", "13.0"]

- name: Update system packages
  when: proxmox_update_system | default(true)
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Add Proxmox VE repository
  block:
    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Remove existing GPG keys if present
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/trusted.gpg.d/proxmox-release.gpg
        - /usr/share/keyrings/proxmox-archive-keyring.gpg
      ignore_errors: yes

    - name: Download Proxmox archive keyring (official method)
      get_url:
        url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ proxmox_release_mapped }}.gpg"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
      ignore_errors: yes

    - name: Verify GPG key was downloaded
      stat:
        path: /usr/share/keyrings/proxmox-archive-keyring.gpg
      register: gpg_key_check
      ignore_errors: yes

    - name: Add Proxmox VE repository using deb822 format (official method)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_mapped }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        mode: '0644'
      when: gpg_key_check.stat.exists

    - name: Remove any incorrectly configured enterprise repository
      file:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent
      ignore_errors: yes

    - name: Remove any old repository files with wrong component
      shell: |
        if [ -f /etc/apt/sources.list.d/pve-install-repo.sources ]; then
          # Check if it has wrong component 'pve' instead of 'pve-no-subscription'
          if grep -q "Components: pve$" /etc/apt/sources.list.d/pve-install-repo.sources; then
            rm -f /etc/apt/sources.list.d/pve-install-repo.sources
            echo "removed"
          fi
        fi
      register: removed_old_repo
      changed_when: removed_old_repo.stdout == "removed"
      failed_when: false

    - name: Add Proxmox VE repository (fallback to old format)
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pve {{ proxmox_release_mapped }} pve-no-subscription"
        state: present
        filename: proxmox-ve
        update_cache: yes
      when: not gpg_key_check.stat.exists
      ignore_errors: yes

    - name: Verify repository was added correctly
      shell: |
        if [ -f /etc/apt/sources.list.d/pve-install-repo.sources ]; then
          cat /etc/apt/sources.list.d/pve-install-repo.sources
        elif [ -f /etc/apt/sources.list.d/proxmox-ve.list ]; then
          cat /etc/apt/sources.list.d/proxmox-ve.list
        else
          echo "No repository file found"
        fi
      register: repo_verify
      changed_when: false
      failed_when: false

    - name: Display repository configuration
      debug:
        msg: "Repository configured: {{ repo_verify.stdout }}"
      when: repo_verify.rc == 0 and "No repository file found" not in repo_verify.stdout

- name: Install Proxmox VE
  when: proxmox_install_packages | default(true)
  block:
    - name: Update apt cache after adding repository
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Check if proxmox-ve package is available
      command: apt-cache search proxmox-ve
      register: proxmox_package_check
      changed_when: false
      failed_when: false

    - name: Display available Proxmox packages
      debug:
        msg: "Available Proxmox packages: {{ proxmox_package_check.stdout_lines }}"
      when: proxmox_package_check.stdout_lines | length > 0

    - name: Check repository sources
      shell: |
        if [ -f /etc/apt/sources.list.d/pve-install-repo.sources ]; then
          cat /etc/apt/sources.list.d/pve-install-repo.sources
        elif [ -f /etc/apt/sources.list.d/proxmox-ve.list ]; then
          cat /etc/apt/sources.list.d/proxmox-ve.list
        else
          echo "No repository file found"
        fi
      register: repo_check
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Display repository configuration
      debug:
        msg: "Proxmox repository: {{ repo_check.stdout }}"
      when: repo_check.rc == 0 and "No repository file found" not in repo_check.stdout

    - name: Try alternative package search
      command: apt-cache madison proxmox-ve
      register: proxmox_madison_check
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Display package availability (madison)
      debug:
        msg: "Package availability: {{ proxmox_madison_check.stdout_lines }}"
      when: proxmox_madison_check.rc == 0 and proxmox_madison_check.stdout_lines | length > 0

    - name: Warn if no Proxmox packages found
      debug:
        msg: |
          ⚠️  WARNING: No Proxmox packages found in repository!
          
          Detected: Debian {{ debian_version }} -> Proxmox release: {{ proxmox_release_mapped }}
          
          Troubleshooting:
          1. Check repository: cat /etc/apt/sources.list.d/proxmox-ve.list
          2. Update cache: sudo apt update
          3. Check if repository is accessible
          4. Verify GPG key is installed correctly
      when: 
        - proxmox_package_check.stdout_lines | length == 0
        - proxmox_madison_check.rc != 0 or proxmox_madison_check.stdout_lines | length == 0

    - name: Pre-configure postfix to avoid interactive prompts
      debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype | default('string') }}"
      loop:
        - { question: 'postfix/main_mailer_type', value: 'Local only', vtype: 'select' }
        - { question: 'postfix/mailname', value: '{{ proxmox_hostname | default(inventory_hostname) }}', vtype: 'string' }
      ignore_errors: yes

    - name: Install Proxmox VE default kernel (required first step per official docs)
      apt:
        name: proxmox-default-kernel
        state: present
      ignore_errors: yes

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
      ignore_errors: yes

    - name: Find Debian kernel packages
      shell: dpkg -l | grep -E '^ii.*linux-image-6\.12' | awk '{print $2}' || true
      register: debian_kernel_packages
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Remove Debian kernel packages (required per official docs)
      apt:
        name: "{{ debian_kernel_packages.stdout_lines + ['linux-image-amd64'] }}"
        state: absent
      ignore_errors: yes
      when: 
        - ansible_os_family == "Debian"
        - debian_kernel_packages.stdout_lines | length > 0 or 'linux-image-amd64' in (ansible_facts.packages | default({}))

    - name: Update GRUB configuration
      command: update-grub
      changed_when: false
      failed_when: false
      ignore_errors: yes
      when: ansible_os_family == "Debian"

    - name: Remove os-prober (if present)
      apt:
        name: os-prober
        state: absent
      ignore_errors: yes

    - name: Verify Proxmox installation
      command: pveversion
      register: proxmox_version_check
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Display Proxmox version if installed
      debug:
        msg: "Proxmox VE version: {{ proxmox_version_check.stdout }}"
      when: proxmox_version_check.rc == 0

- name: Configure Proxmox
  when: proxmox_configure | default(true)
  block:
    - name: Set hostname (if specified)
      hostname:
        name: "{{ proxmox_hostname }}"
      when: proxmox_hostname is defined

    - name: Configure network (if specified)
      block:
        - name: Backup network configuration
          copy:
            src: /etc/network/interfaces
            dest: /etc/network/interfaces.backup
            remote_src: yes
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Configure network interfaces
          template:
            src: interfaces.j2
            dest: /etc/network/interfaces
            backup: yes
          when: 
            - proxmox_network_config is defined
            - proxmox_network_config | length > 0
          ignore_errors: yes
      when: proxmox_network_config is defined

- name: Reboot system (if required)
  when: proxmox_reboot_after_install | default(true)
  block:
    - name: Check if reboot is required
      shell: test -f /var/run/reboot-required && echo "yes" || echo "no"
      register: reboot_required
      changed_when: false
      failed_when: false

    - name: Reboot system
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
        connect_timeout: 5
      when: 
        - reboot_required.stdout == "yes"
        - ansible_connection != "local"
      
    - name: Warn about manual reboot needed
      debug:
        msg: |
          ⚠️  Reboot is required but cannot be done automatically (localhost connection).
          Please reboot manually: sudo reboot
      when:
        - reboot_required.stdout == "yes"
        - ansible_connection == "local"

- name: Get system hostname
  command: hostname
  register: system_hostname
  changed_when: false
  failed_when: false

- name: Display installation summary
  debug:
    msg: |
      ✅ Proxmox VE installation completed!
      
      Next steps:
      1. Reboot the system if required
      2. Access the web interface at: https://{{ proxmox_hostname | default(system_hostname.stdout) }}:8006
      3. Login with root credentials
      4. Configure your storage and network settings
      
      Note: If you changed the hostname, make sure DNS is configured correctly.

