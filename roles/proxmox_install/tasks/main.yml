---
# Proxmox VE Installation Role
# Optimized for fresh VM installation - fully automated and idempotent

- name: Detect OS and version
  block:
    - name: Get OS information
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "$ID|$VERSION_ID"
        elif [ -f /etc/debian_version ]; then
          echo "debian|$(cat /etc/debian_version)"
        else
          echo "unknown|unknown"
        fi
      register: os_info
      changed_when: false
      failed_when: false

    - name: Set OS facts
      set_fact:
        ansible_os_family: "{{ 'Debian' if 'debian' in os_info.stdout else 'Unknown' }}"
        debian_version: "{{ os_info.stdout.split('|')[1] }}"

- name: Verify Debian-based system
  fail:
    msg: "Proxmox VE requires Debian 11, 12, or 13. Detected: {{ ansible_os_family }}"
  when: ansible_os_family != "Debian"

- name: Map Debian version to Proxmox release
  set_fact:
    proxmox_release_mapped: >-
      {%- if debian_version in ["11", "11.0", "bullseye"] -%}bullseye
      {%- elif debian_version in ["12", "12.0", "bookworm"] -%}bookworm
      {%- elif debian_version in ["13", "13.0", "trixie"] -%}trixie
      {%- else -%}{{ proxmox_release | default('trixie') }}
      {%- endif -%}

- name: Check if Proxmox is already installed
  command: pveversion
  register: proxmox_installed
  changed_when: false
  failed_when: false

- name: Pre-configure packages for non-interactive installation
  when: proxmox_installed.rc != 0
  block:
    - name: Pre-configure postfix
      debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: 'postfix/main_mailer_type', value: 'Local only', vtype: 'select' }
        - { question: 'postfix/mailname', value: '{{ proxmox_hostname | default(inventory_hostname) }}', vtype: 'string' }

    - name: Set DEBIAN_FRONTEND for all apt operations
      set_fact:
        apt_environment:
          DEBIAN_FRONTEND: noninteractive

- name: Clean up old Proxmox repositories (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Check for existing Proxmox repositories
      find:
        paths: /etc/apt/sources.list.d
        patterns: "pve*.list,pve*.sources,proxmox*.list,proxmox*.sources"
        file_type: file
      register: existing_repos

    - name: Remove old Proxmox repository files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_repos.files | default([]) }}"
      when: existing_repos.files | length > 0

    - name: Clean problematic entries from sources.list
      lineinfile:
        path: /etc/apt/sources.list
        regexp: '^\s*(deb|deb-src).*proxmox\.com/debian/pve'
        state: absent
      when: existing_repos.files | length > 0

- name: Update system packages (if enabled and not installed)
  when: 
    - proxmox_update_system | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        cache_valid_time: 3600
        environment: "{{ apt_environment | default({}) }}"

- name: Install prerequisites (only if not installed)
  when: proxmox_installed.rc != 0
  apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes
    cache_valid_time: 3600
    environment: "{{ apt_environment | default({}) }}"

- name: Setup Proxmox repository (only if not installed)
  when: proxmox_installed.rc != 0
  block:
    - name: Check if GPG key already exists
      stat:
        path: /usr/share/keyrings/proxmox-archive-keyring.gpg
      register: gpg_key_exists

    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'
      when: not gpg_key_exists.stat.exists

    - name: Download Proxmox GPG key
      get_url:
        url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ proxmox_release_mapped }}.gpg"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
      when: not gpg_key_exists.stat.exists

    - name: Check if repository already configured correctly
      stat:
        path: /etc/apt/sources.list.d/pve-install-repo.sources
      register: repo_file_exists

    - name: Read existing repository config
      slurp:
        src: /etc/apt/sources.list.d/pve-install-repo.sources
      register: existing_repo_config
      when: repo_file_exists.stat.exists
      failed_when: false

    - name: Add Proxmox repository (deb822 format)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_mapped }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        mode: '0644'
      when: 
        - not repo_file_exists.stat.exists
        - or
        - existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined
        - existing_repo_config.content | b64decode | default('') | regex_search('Components:\s*pve-no-subscription') is not defined

    - name: Update apt cache with Proxmox repository
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: not repo_file_exists.stat.exists or (existing_repo_config.content | b64decode | default('') | regex_search('Suites:\s*' + proxmox_release_mapped) is not defined)

    - name: Verify Proxmox packages are available
      command: apt-cache madison proxmox-ve
      register: proxmox_available
      changed_when: false
      failed_when: false

    - name: Fail if Proxmox packages not available
      fail:
        msg: |
          Proxmox packages not found in repository!
          Debian: {{ debian_version }} -> Proxmox: {{ proxmox_release_mapped }}
          Run: apt update && apt-cache search proxmox-ve
      when: proxmox_available.rc != 0 or proxmox_available.stdout_lines | length == 0

- name: Install Proxmox VE (only if not installed)
  when: 
    - proxmox_install_packages | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Install Proxmox kernel first
      apt:
        name: proxmox-default-kernel
        state: present
        environment: "{{ apt_environment | default({}) }}"

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
        environment: "{{ apt_environment | default({}) }}"

    - name: Ensure SSH service is enabled and started
      systemd:
        name: ssh
        enabled: yes
        state: started
      failed_when: false

    - name: Remove os-prober
      apt:
        name: os-prober
        state: absent
      environment: "{{ apt_environment | default({}) }}"
      failed_when: false

    - name: Get installed Debian kernels
      shell: dpkg -l | grep -E '^ii.*linux-image-(amd64|6\.12)' | awk '{print $2}' || true
      register: debian_kernels
      changed_when: false
      failed_when: false

    - name: Remove Debian kernels
      apt:
        name: "{{ debian_kernels.stdout_lines + ['linux-image-amd64'] }}"
        state: absent
      when: debian_kernels.stdout_lines | length > 0
      environment: "{{ apt_environment | default({}) }}"
      failed_when: false

    - name: Update GRUB after kernel removal
      command: update-grub
      changed_when: false
      failed_when: false
      when: debian_kernels.stdout_lines | length > 0

    - name: Verify installation
      command: pveversion
      register: proxmox_version
      changed_when: false
      failed_when: false

    - name: Display Proxmox version
      debug:
        msg: "Proxmox VE {{ proxmox_version.stdout }} installed successfully"
      when: proxmox_version.rc == 0

- name: Configure Proxmox (only if enabled and not already configured)
  when: 
    - proxmox_configure | default(true)
    - proxmox_installed.rc == 0
  block:
    - name: Set hostname
      hostname:
        name: "{{ proxmox_hostname }}"
      when: proxmox_hostname is defined

    - name: Configure network
      template:
        src: interfaces.j2
        dest: /etc/network/interfaces
        backup: yes
      when:
        - proxmox_network_config is defined
        - proxmox_network_config | length > 0
      ignore_errors: yes

- name: Handle reboot (only if installation was performed)
  when: 
    - proxmox_reboot_after_install | default(true)
    - proxmox_installed.rc != 0
  block:
    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_file

    - name: Prompt for reboot
      pause:
        prompt: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          A reboot is required to complete the Proxmox VE installation.
          
          Do you want to reboot now? (yes/no)
          ============================================================================
        echo: yes
      register: reboot_prompt
      when: reboot_file.stat.exists

    - name: Reboot system
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
      when:
        - reboot_file.stat.exists
        - reboot_prompt.user_input | default('no') | lower == 'yes'
      ignore_errors: yes

    - name: Remind to reboot manually
      debug:
        msg: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          Please reboot manually: sudo reboot
          ============================================================================
      when:
        - reboot_file.stat.exists
        - reboot_prompt.user_input | default('no') | lower != 'yes'

- name: Display installation summary
  debug:
    msg: |
      ============================================================================
      Proxmox VE Installation {{ 'Complete' if (proxmox_installed.rc == 0) else 'Ready' }}!
      ============================================================================
      {% if proxmox_installed.rc == 0 %}
      Status: Already installed ({{ proxmox_version.stdout | default('version unknown') }})
      {% else %}
      Status: Installation completed
      {% endif %}
      
      Next Steps:
      
      {% if proxmox_installed.rc != 0 %}
      1. Reboot the system (if required)
         $ sudo reboot
      {% endif %}
      
      2. Access the Web Interface
         URL: https://{{ proxmox_hostname | default(inventory_hostname) }}:8006
         Login: root / (your root password)
      
      3. Configure Proxmox
         - Set up storage
         - Configure network bridges
         - Create virtual machines/containers
      
      Important Notes:
      - If you changed the hostname, ensure DNS is configured correctly
      - The hostname must resolve to a non-loopback IP address
      - Check /etc/hosts if hostname resolution fails
      
      Documentation: https://pve.proxmox.com/pve-docs/
      ============================================================================
