---
- name: Detect OS family
  block:
    - name: Detect OS family
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              echo "Debian"
              ;;
            rhel|centos|fedora|rocky|almalinux)
              echo "RedHat"
              ;;
            *)
              echo "Unknown"
              ;;
          esac
        elif [ -f /etc/redhat-release ]; then
          echo "RedHat"
        elif [ -f /etc/debian_version ]; then
          echo "Debian"
        else
          echo "Unknown"
        fi
      register: os_family_result
      changed_when: false
      failed_when: false

    - name: Set OS family fact
      set_fact:
        ansible_os_family: "{{ os_family_result.stdout }}"

- name: Check if running on Debian-based system
  fail:
    msg: "Proxmox VE can only be installed on Debian-based systems (Debian 11/12)"
  when: ansible_os_family != "Debian"

- name: Detect Debian version
  shell: |
    if [ -f /etc/os-release ]; then
      . /etc/os-release
      echo "$VERSION_ID"
    elif [ -f /etc/debian_version ]; then
      cat /etc/debian_version
    else
      echo "unknown"
    fi
  register: debian_version_result
  changed_when: false
  failed_when: false

- name: Set Debian version fact
  set_fact:
    debian_version: "{{ debian_version_result.stdout }}"

- name: Map Debian version to Proxmox release name
  set_fact:
    proxmox_release_mapped: >-
      {%- if debian_version in ["11", "11.0", "bullseye"] -%}
        bullseye
      {%- elif debian_version in ["12", "12.0", "bookworm"] -%}
        bookworm
      {%- elif debian_version in ["13", "13.0", "trixie"] -%}
        trixie
      {%- else -%}
        {{ proxmox_release | default('trixie') }}
      {%- endif -%}

- name: Warn if not Debian 11, 12, or 13
  debug:
    msg: |
      ⚠️  WARNING: Proxmox VE officially supports Debian 11 (Bullseye), Debian 12 (Bookworm), and Debian 13 (Trixie).
      Detected version: {{ debian_version }}
      Using Proxmox release: {{ proxmox_release_mapped }}
      Proceeding anyway, but installation may fail.
  when: debian_version not in ["11", "12", "13", "bullseye", "bookworm", "trixie", "11.0", "12.0", "13.0"]

- name: Clean up ALL existing Proxmox repositories FIRST (before any apt operations)
  # This must run BEFORE any apt update/install operations to prevent errors
  block:
    - name: Remove ALL existing Proxmox repository files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/pve.list
        - /etc/apt/sources.list.d/pve-install-repo.sources
        - /etc/apt/sources.list.d/proxmox-ve.list
        - /etc/apt/sources.list.d/pve-no-subscription.list
      ignore_errors: yes

    - name: Remove any remaining Proxmox repository files with wrong configuration
      shell: |
        REMOVED=""
        # Check all possible repository file locations - ONLY Proxmox-specific files
        # We only target files with 'pve' or 'proxmox' in the name to avoid touching Debian repos
        for file in /etc/apt/sources.list.d/pve*.sources /etc/apt/sources.list.d/pve*.list /etc/apt/sources.list.d/proxmox*.list /etc/apt/sources.list.d/proxmox*.sources; do
          if [ -f "$file" ]; then
            # Remove if it has wrong component 'pve' (enterprise) instead of 'pve-no-subscription'
            if grep -qE "Components:\s*pve[^-]" "$file" 2>/dev/null || grep -qE "pve\s+pve[^-]" "$file" 2>/dev/null; then
              rm -f "$file"
              REMOVED="$REMOVED $file"
            # Remove if it uses enterprise URL for packages (not just GPG key)
            elif grep -qE "https?://enterprise\.proxmox\.com/debian/pve" "$file" 2>/dev/null; then
              rm -f "$file"
              REMOVED="$REMOVED $file"
            fi
          fi
        done
        # Also check main sources.list file - but ONLY for Proxmox-specific entries
        # We use very specific patterns to ONLY match Proxmox repos, never Debian repos
        if [ -f /etc/apt/sources.list ]; then
          # Only comment out lines that contain BOTH "proxmox" AND "pve" to avoid false positives
          # This ensures we never touch Debian repository lines
          if grep -qE "enterprise\.proxmox\.com/debian/pve" /etc/apt/sources.list 2>/dev/null || grep -qE "download\.proxmox\.com/debian/pve.*pve[^-]" /etc/apt/sources.list 2>/dev/null; then
            # Comment out ONLY Proxmox-specific lines - very targeted sed patterns
            sed -i '/enterprise\.proxmox\.com\/debian\/pve/s/^/# /' /etc/apt/sources.list
            sed -i '/download\.proxmox\.com\/debian\/pve.*pve[^-]/s/^/# /' /etc/apt/sources.list
            REMOVED="$REMOVED /etc/apt/sources.list (commented Proxmox entries only)"
          fi
        fi
        if [ -n "$REMOVED" ]; then
          echo "removed:$REMOVED"
        fi
      register: removed_old_repo
      changed_when: "'removed:' in removed_old_repo.stdout"
      failed_when: false

- name: Update system packages
  when: proxmox_update_system | default(true)
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Add Proxmox VE repository
  block:
    # IMPORTANT: We ALWAYS use the community (no-subscription) repository, NOT the enterprise repository
    # - Repository URL: http://download.proxmox.com/debian/pve (community)
    # - Component: pve-no-subscription (NOT pve which is enterprise)
    # - The GPG key is downloaded from enterprise.proxmox.com, but that's just where the keyring file is hosted
    #   The actual package repository is the community one above
    
    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Remove existing GPG keys if present
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/trusted.gpg.d/proxmox-release.gpg
        - /usr/share/keyrings/proxmox-archive-keyring.gpg
      ignore_errors: yes

    - name: Download Proxmox archive keyring (official method)
      # Note: The GPG keyring file is hosted on enterprise.proxmox.com, but this is just the key file
      # The actual package repository we use is the community one (http://download.proxmox.com/debian/pve)
      get_url:
        url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ proxmox_release_mapped }}.gpg"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
      ignore_errors: yes

    - name: Verify GPG key was downloaded
      stat:
        path: /usr/share/keyrings/proxmox-archive-keyring.gpg
      register: gpg_key_check
      ignore_errors: yes

    # Note: Repository cleanup already happened earlier in the playbook
    # This block just adds the correct repository

    - name: Add Proxmox VE repository using deb822 format (official method)
      # Using community (no-subscription) repository - NOT enterprise
      # Following official documentation: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_13_Trixie
      # Repository: http://download.proxmox.com/debian/pve
      # Component: pve-no-subscription (community/free, no subscription required)
      copy:
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_mapped }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        mode: '0644'
      when: gpg_key_check.stat.exists

    - name: Update apt cache after repository cleanup and configuration
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: gpg_key_check.stat.exists

    - name: Add Proxmox VE repository (fallback to old format)
      # Using community (no-subscription) repository - NOT enterprise
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pve {{ proxmox_release_mapped }} pve-no-subscription"
        state: present
        filename: proxmox-ve
        update_cache: yes
      when: not gpg_key_check.stat.exists
      ignore_errors: yes

    - name: Verify repository was added correctly
      shell: |
        if [ -f /etc/apt/sources.list.d/pve-install-repo.sources ]; then
          cat /etc/apt/sources.list.d/pve-install-repo.sources
        elif [ -f /etc/apt/sources.list.d/proxmox-ve.list ]; then
          cat /etc/apt/sources.list.d/proxmox-ve.list
        else
          echo "No repository file found"
        fi
      register: repo_verify
      changed_when: false
      failed_when: false

    - name: Display repository configuration
      debug:
        msg: "Repository configured: {{ repo_verify.stdout }}"
      when: repo_verify.rc == 0 and "No repository file found" not in repo_verify.stdout

- name: Install Proxmox VE
  when: proxmox_install_packages | default(true)
  block:
    # Note: apt cache is updated in the repository block after cleanup
    # This ensures we have the correct repository before trying to install packages

    - name: Check if proxmox-ve package is available
      command: apt-cache search proxmox-ve
      register: proxmox_package_check
      changed_when: false
      failed_when: false

    - name: Display available Proxmox packages
      debug:
        msg: "Available Proxmox packages: {{ proxmox_package_check.stdout_lines }}"
      when: proxmox_package_check.stdout_lines | length > 0

    - name: Check repository sources
      shell: |
        if [ -f /etc/apt/sources.list.d/pve-install-repo.sources ]; then
          cat /etc/apt/sources.list.d/pve-install-repo.sources
        elif [ -f /etc/apt/sources.list.d/proxmox-ve.list ]; then
          cat /etc/apt/sources.list.d/proxmox-ve.list
        else
          echo "No repository file found"
        fi
      register: repo_check
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Display repository configuration
      debug:
        msg: "Proxmox repository: {{ repo_check.stdout }}"
      when: repo_check.rc == 0 and "No repository file found" not in repo_check.stdout

    - name: Try alternative package search
      command: apt-cache madison proxmox-ve
      register: proxmox_madison_check
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Display package availability (madison)
      debug:
        msg: "Package availability: {{ proxmox_madison_check.stdout_lines }}"
      when: proxmox_madison_check.rc == 0 and proxmox_madison_check.stdout_lines | length > 0

    - name: Warn if no Proxmox packages found
      debug:
        msg: |
          ⚠️  WARNING: No Proxmox packages found in repository!
          
          Detected: Debian {{ debian_version }} -> Proxmox release: {{ proxmox_release_mapped }}
          
          Troubleshooting:
          1. Check repository: cat /etc/apt/sources.list.d/proxmox-ve.list
          2. Update cache: sudo apt update
          3. Check if repository is accessible
          4. Verify GPG key is installed correctly
      when: 
        - proxmox_package_check.stdout_lines | length == 0
        - proxmox_madison_check.rc != 0 or proxmox_madison_check.stdout_lines | length == 0

    - name: Pre-configure postfix to avoid interactive prompts
      # Per official docs: Configure as "satellite system" if you have a mail server,
      # or "local only" if you don't. We default to "local only" for non-interactive install.
      debconf:
        name: postfix
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype | default('string') }}"
      loop:
        - { question: 'postfix/main_mailer_type', value: 'Local only', vtype: 'select' }
        - { question: 'postfix/mailname', value: '{{ proxmox_hostname | default(inventory_hostname) }}', vtype: 'string' }
      ignore_errors: yes

    - name: Install Proxmox VE default kernel (required first step per official docs)
      apt:
        name: proxmox-default-kernel
        state: present
      ignore_errors: yes

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
      ignore_errors: yes

    - name: Find Debian kernel packages
      shell: dpkg -l | grep -E '^ii.*linux-image-6\.12' | awk '{print $2}' || true
      register: debian_kernel_packages
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Remove Debian kernel packages (required per official docs)
      apt:
        name: "{{ debian_kernel_packages.stdout_lines + ['linux-image-amd64'] }}"
        state: absent
      ignore_errors: yes
      when: 
        - ansible_os_family == "Debian"
        - debian_kernel_packages.stdout_lines | length > 0 or 'linux-image-amd64' in (ansible_facts.packages | default({}))

    - name: Update GRUB configuration
      command: update-grub
      changed_when: false
      failed_when: false
      ignore_errors: yes
      when: ansible_os_family == "Debian"

    - name: Remove os-prober (if present)
      apt:
        name: os-prober
        state: absent
      ignore_errors: yes

    - name: Verify Proxmox installation
      command: pveversion
      register: proxmox_version_check
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Display Proxmox version if installed
      debug:
        msg: "Proxmox VE version: {{ proxmox_version_check.stdout }}"
      when: proxmox_version_check.rc == 0

- name: Configure Proxmox
  when: proxmox_configure | default(true)
  block:
    - name: Set hostname (if specified)
      hostname:
        name: "{{ proxmox_hostname }}"
      when: proxmox_hostname is defined

    - name: Configure network (if specified)
      block:
        - name: Backup network configuration
          copy:
            src: /etc/network/interfaces
            dest: /etc/network/interfaces.backup
            remote_src: yes
          when: ansible_os_family == "Debian"
          ignore_errors: yes

        - name: Configure network interfaces
          template:
            src: interfaces.j2
            dest: /etc/network/interfaces
            backup: yes
          when: 
            - proxmox_network_config is defined
            - proxmox_network_config | length > 0
          ignore_errors: yes
      when: proxmox_network_config is defined

- name: Reboot system (if required)
  when: proxmox_reboot_after_install | default(true)
  block:
    - name: Check if reboot is required
      shell: test -f /var/run/reboot-required && echo "yes" || echo "no"
      register: reboot_required
      changed_when: false
      failed_when: false

    - name: Ask user if they want to reboot
      pause:
        prompt: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          A reboot is required to complete the Proxmox VE installation.
          
          Do you want to reboot now? (yes/no)
          
          Note: If running on localhost, you'll need to reboot manually.
          ============================================================================
        echo: yes
      register: reboot_prompt
      when: 
        - reboot_required.stdout == "yes"
        - ansible_connection != "local"
      failed_when: false

    - name: Reboot system (if user confirmed)
      reboot:
        msg: "Rebooting after Proxmox VE installation"
        reboot_timeout: 600
        connect_timeout: 5
      when: 
        - reboot_required.stdout == "yes"
        - ansible_connection != "local"
        - reboot_prompt.user_input | default('no') | lower == 'yes'
      
    - name: Skip reboot (user declined)
      debug:
        msg: |
          Reboot skipped. Please reboot manually when ready:
          $ sudo reboot
      when: 
        - reboot_required.stdout == "yes"
        - ansible_connection != "local"
        - reboot_prompt.user_input | default('no') | lower != 'yes'
      
    - name: Warn about manual reboot needed (localhost)
      debug:
        msg: |
          ============================================================================
          Reboot Required
          ============================================================================
          
          A reboot is required but cannot be done automatically (localhost connection).
          
          Please reboot manually when ready:
          $ sudo reboot
          ============================================================================
      when:
        - reboot_required.stdout == "yes"
        - ansible_connection == "local"

- name: Get system hostname
  command: hostname
  register: system_hostname
  changed_when: false
  failed_when: false

- name: Display installation summary
  debug:
    msg: |
      ============================================================================
      Proxmox VE Installation Complete!
      ============================================================================
      
      Next Steps:
      
      1. Reboot the system (if required)
         $ sudo reboot
      
      2. Access the Web Interface
         URL: https://{{ proxmox_hostname | default(system_hostname.stdout) }}:8006
         Login: root / (your root password)
      
      3. Configure Proxmox
         - Set up storage
         - Configure network bridges
         - Create virtual machines/containers
      
      Important Notes:
      - If you changed the hostname, ensure DNS is configured correctly
      - The hostname must resolve to a non-loopback IP address
      - Check /etc/hosts if hostname resolution fails
      
      Documentation: https://pve.proxmox.com/pve-docs/
      ============================================================================

