---
- name: Get existing users on system
  getent:
    database: passwd
  register: existing_users

- name: Set fact for existing user names
  set_fact:
    existing_user_names: "{{ existing_users.ansible_facts.getent_passwd.keys() | list }}"

- name: Ensure users exist (create or update)
  block:
    - name: Create or update user accounts
      user:
        name: "{{ item.name }}"
        state: present
        groups: "{{ item.groups | default([]) }}"
        append: "{{ item.append | default(true) }}"
        shell: "{{ item.shell | default('/bin/bash') }}"
        home: "{{ item.home | default(omit) }}"
        create_home: "{{ item.create_home | default(true) }}"
        comment: "{{ item.comment | default(omit) }}"
        password: "{{ item.password | default(omit) }}"
        password_lock: "{{ item.password_lock | default(item.password is not defined or item.password == '') }}"
        system: "{{ item.system | default(false) }}"
        uid: "{{ item.uid | default(omit) }}"
        generate_ssh_key: "{{ item.generate_ssh_key | default(false) }}"
        ssh_key_bits: "{{ item.ssh_key_bits | default(2048) }}"
        ssh_key_type: "{{ item.ssh_key_type | default('rsa') }}"
      loop: "{{ users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: user_result

    - name: Add SSH authorized keys for users
      authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_public_key }}"
        state: present
        exclusive: "{{ item.ssh_keys_exclusive | default(false) }}"
      loop: "{{ users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: 
        - item.ssh_public_key is defined
        - item.ssh_public_key | length > 0
      ignore_errors: false

- name: Configure sudo access for users
  block:
    - name: Ensure /etc/sudoers.d exists
      file:
        path: /etc/sudoers.d
        state: directory
        mode: '0750'
        owner: root
        group: root

    - name: Configure sudo access (passwordless or password-required)
      lineinfile:
        path: "/etc/sudoers.d/{{ item.name }}"
        line: "{{ item.name }} ALL=(ALL:ALL) {{ 'NOPASSWD:' if (item.sudo_passwordless | default(false)) else '' }}ALL"
        create: yes
        mode: '0440'
        owner: root
        group: root
        validate: 'visudo -cf %s'
      loop: "{{ users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.groups is defined
        - 'sudo' in item.groups
      ignore_errors: false

    - name: Remove sudoers files for users no longer in sudo group
      file:
        path: "/etc/sudoers.d/{{ item }}"
        state: absent
      loop: "{{ existing_user_names }}"
      when:
        - item not in (users | default([]) | map(attribute='name') | list)
        - item != 'root'
      ignore_errors: yes

- name: Remove users not in variables file
  when: remove_orphaned_users | default(false)
  block:
    - name: Get users to delete (exist on system but not in variables)
      set_fact:
        candidate_users_to_delete: "{{ existing_user_names | difference(users | default([]) | map(attribute='name') | list) }}"
    
    - name: Get UID for each candidate user
      set_fact:
        users_with_uid: "{{ users_with_uid | default([]) + [{'name': item, 'uid': existing_users.ansible_facts.getent_passwd[item][1] | int}] }}"
      loop: "{{ candidate_users_to_delete }}"
      when: candidate_users_to_delete | length > 0
    
    - name: Filter out system users (UID < 1000) and protected accounts
      set_fact:
        protected_users: "{{ protected_users | default(['root']) + (system_users | default([])) }}"
    
    - name: Build final list of users to delete (exclude system users and protected)
      set_fact:
        users_to_delete: "{{ users_with_uid | default([]) | selectattr('uid', '>=', 1000) | selectattr('name', 'not in', protected_users) | map(attribute='name') | list }}"
    
    - name: Remove orphaned user accounts
      user:
        name: "{{ item }}"
        state: absent
        remove: "{{ remove_home_on_delete | default(false) }}"
        force: "{{ force_remove | default(false) }}"
      loop: "{{ users_to_delete }}"
      when: users_to_delete | length > 0
      register: delete_result

    - name: Display deleted users
      debug:
        msg: "Removed user '{{ item }}' (not in variables file)"
      loop: "{{ users_to_delete }}"
      when: 
        - users_to_delete | length > 0
        - delete_result.changed
    
    - name: Get protected users that were skipped
      set_fact:
        protected_skipped: "{{ (users_with_uid | default([]) | selectattr('uid', '<', 1000) | list) + (users_with_uid | default([]) | selectattr('name', 'in', protected_users | default([])) | list) }}"
      when: users_with_uid is defined
    
    - name: Warn about protected users that were skipped
      debug:
        msg: "Skipped deletion of protected/system user '{{ item.name }}' (UID: {{ item.uid }})"
      loop: "{{ protected_skipped | default([]) }}"
      when: 
        - protected_skipped is defined
        - protected_skipped | length > 0
