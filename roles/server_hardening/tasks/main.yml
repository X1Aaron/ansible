---
- name: Pre-flight safety checks
  when: hardening_ssh_harden | default(true) and (hardening_ssh_password_auth | default("no")) == "no"
  block:
    - name: Get actual login username (not effective user)
      shell: |
        logname 2>/dev/null || echo "$SUDO_USER" || who am i | awk '{print $1}' || id -un
      register: login_user_result
      changed_when: false
      failed_when: false

    - name: Get login user's home directory
      shell: |
        LOGIN_USER=$(logname 2>/dev/null || echo "$SUDO_USER" || who am i | awk '{print $1}' || id -un)
        getent passwd "$LOGIN_USER" | cut -d: -f6
      register: user_home_result
      changed_when: false
      failed_when: false

    - name: Set user home directory and login user facts
      set_fact:
        user_home: "{{ user_home_result.stdout | default('/home/' + login_user) }}"
        current_user: "{{ login_user_result.stdout | default('root') }}"
        login_user: "{{ login_user_result.stdout | default('root') }}"

    - name: Check if current user has SSH key authentication
      stat:
        path: "{{ user_home }}/.ssh/authorized_keys"
      register: user_ssh_keys
      failed_when: false

    - name: Warn if no SSH keys found and password auth will be disabled
      debug:
        msg: |
          ⚠️  WARNING: Password authentication will be DISABLED, but no SSH keys found for user '{{ current_user }}'!
          
          This could LOCK YOU OUT of the server!
          
          Before continuing:
          1. Make sure you have SSH keys configured: cat ~/.ssh/authorized_keys
          2. Test SSH key login from another terminal
          3. Have console/out-of-band access available
          4. Keep this SSH session open until you verify you can reconnect
          
          If unsure, set hardening_ssh_password_auth: "yes" in vars/hardening.local.yml
        verbosity: 0
      when: not user_ssh_keys.stat.exists or user_ssh_keys.stat.size == 0

    - name: Fail if root user and root login will be disabled
      fail:
        msg: |
          ⚠️  ERROR: You are logged in as root, but hardening will DISABLE root SSH login!
          
          This will LOCK YOU OUT!
          
          Solution:
          1. Create a regular user with sudo access first (run user-management playbook)
          2. Add your SSH key to that user
          3. Then run this hardening playbook
      when: 
        - login_user == "root"
        - (hardening_ssh_permit_root_login | default("no")) == "no"

- name: Update system packages
  when: hardening_update_packages | default(true)
  block:
    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Upgrade all packages (Debian/Ubuntu)
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Update packages (RHEL/CentOS)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

- name: Configure automatic security updates
  when: hardening_auto_updates | default(true)
  block:
    - name: Install unattended-upgrades (Debian/Ubuntu)
      apt:
        name: unattended-upgrades
        state: present
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Configure unattended-upgrades
      copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
      when: ansible_os_family == "Debian"
      ignore_errors: yes

- name: Harden SSH configuration
  when: hardening_ssh_harden | default(true)
  block:
    - name: Backup SSH config
      copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.backup
        remote_src: yes
      when: not (hardening_ssh_config_backup | default(true) | bool == false)

    - name: Configure SSH hardening
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        backup: yes
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ hardening_ssh_permit_root_login | default("no") }}' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ hardening_ssh_password_auth | default("no") }}' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication {{ hardening_ssh_pubkey_auth | default("yes") }}' }
        - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding {{ hardening_ssh_x11_forwarding | default("no") }}' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ hardening_ssh_max_auth_tries | default(3) }}' }
        - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ hardening_ssh_client_alive_interval | default(300) }}' }
        - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ hardening_ssh_client_alive_count_max | default(2) }}' }
        - { regexp: '^#?Protocol', line: 'Protocol 2' }
      notify: restart sshd

    - name: Set SSH port if specified
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port'
        line: "Port {{ hardening_ssh_port }}"
        state: present
        backup: yes
      when: hardening_ssh_port is defined
      notify: restart sshd

- name: Configure firewall
  when: hardening_configure_firewall | default(true)
  block:
    - name: Install UFW (Debian/Ubuntu)
      apt:
        name: ufw
        state: present
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Install firewalld (RHEL/CentOS)
      yum:
        name: firewalld
        state: present
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Configure UFW default policies
      ufw:
        state: enabled
        policy: "{{ item.policy }}"
        direction: "{{ item.direction }}"
      loop:
        - { policy: deny, direction: incoming }
        - { policy: allow, direction: outgoing }
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Allow SSH through UFW
      ufw:
        rule: allow
        name: "{{ item }}"
        state: enabled
      loop: "{{ hardening_firewall_allowed_services | default(['OpenSSH']) }}"
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Start and enable firewalld (RHEL/CentOS)
      systemd:
        name: firewalld
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Configure firewalld default zone
      firewalld:
        zone: public
        permanent: yes
        state: enabled
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

- name: Install and configure fail2ban
  when: hardening_configure_fail2ban | default(true)
  block:
    - name: Install fail2ban
      package:
        name: fail2ban
        state: present
      ignore_errors: yes

    - name: Set fail2ban log path based on OS
      set_fact:
        fail2ban_logpath: "{{ '/var/log/auth.log' if ansible_os_family == 'Debian' else '/var/log/secure' }}"

    - name: Configure fail2ban
      copy:
        content: |
          [DEFAULT]
          bantime = {{ hardening_fail2ban_bantime | default(3600) }}
          findtime = {{ hardening_fail2ban_findtime | default(600) }}
          maxretry = {{ hardening_fail2ban_maxretry | default(5) }}
          destemail = {{ hardening_fail2ban_email | default('root@localhost') }}
          sendername = Fail2Ban
          action = %(action_)s

          [sshd]
          enabled = true
          port = {{ hardening_ssh_port | default('ssh') }}
          filter = sshd
          logpath = {{ fail2ban_logpath }}
        dest: /etc/fail2ban/jail.local
      notify: restart fail2ban

    - name: Start and enable fail2ban
      systemd:
        name: fail2ban
        state: started
        enabled: yes

- name: Configure kernel parameters
  when: hardening_harden_kernel | default(true)
  block:
    - name: Set kernel parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: yes
        reload: yes
      loop:
        - { name: net.ipv4.ip_forward, value: '0' }
        - { name: net.ipv4.conf.all.send_redirects, value: '0' }
        - { name: net.ipv4.conf.default.send_redirects, value: '0' }
        - { name: net.ipv4.conf.all.accept_redirects, value: '0' }
        - { name: net.ipv4.conf.default.accept_redirects, value: '0' }
        - { name: net.ipv4.conf.all.accept_source_route, value: '0' }
        - { name: net.ipv4.conf.default.accept_source_route, value: '0' }
        - { name: net.ipv4.conf.all.log_martians, value: '1' }
        - { name: net.ipv4.conf.default.log_martians, value: '1' }
        - { name: net.ipv4.icmp_echo_ignore_broadcasts, value: '1' }
        - { name: net.ipv4.icmp_ignore_bogus_error_responses, value: '1' }
        - { name: net.ipv4.tcp_syncookies, value: '1' }
        - { name: net.ipv6.conf.all.accept_redirects, value: '0' }
        - { name: net.ipv6.conf.default.accept_redirects, value: '0' }
        - { name: net.ipv6.conf.all.accept_source_route, value: '0' }
        - { name: net.ipv6.conf.default.accept_source_route, value: '0' }
      ignore_errors: yes

- name: Disable unnecessary services
  when: hardening_disable_services | default(true)
  block:
    - name: Stop and disable unnecessary services
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop: "{{ hardening_disabled_services | default(['telnet', 'rsh', 'rlogin', 'rexec', 'nis']) }}"
      ignore_errors: yes

- name: Configure time synchronization
  when: hardening_configure_ntp | default(true)
  block:
    - name: Install chrony (preferred)
      package:
        name: chrony
        state: present
      ignore_errors: yes

    - name: Install ntp (fallback)
      package:
        name: ntp
        state: present
      when: ansible_pkg_mgr == "apt"
      ignore_errors: yes

    - name: Start and enable chronyd
      systemd:
        name: chronyd
        state: started
        enabled: yes
      ignore_errors: yes

    - name: Start and enable ntpd
      systemd:
        name: ntpd
        state: started
        enabled: yes
      when: ansible_pkg_mgr == "apt"
      ignore_errors: yes

- name: Set restrictive file permissions
  when: hardening_set_file_permissions | default(true)
  block:
    - name: Set restrictive permissions on sensitive files
      file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
        state: file
      loop: "{{ hardening_file_permissions | default([{'path': '/etc/passwd', 'mode': '0644'}, {'path': '/etc/shadow', 'mode': '0640'}, {'path': '/etc/group', 'mode': '0644'}]) }}"
      ignore_errors: yes

- name: Configure audit logging
  when: hardening_configure_audit | default(true)
  block:
    - name: Install auditd (Debian/Ubuntu)
      apt:
        name: auditd
        state: present
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Install audit (RHEL/CentOS)
      yum:
        name: audit
        state: present
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Start and enable auditd
      systemd:
        name: auditd
        state: started
        enabled: yes
      ignore_errors: yes

- name: Disable IPv6 if not needed
  when: hardening_disable_ipv6 | default(false)
  block:
    - name: Disable IPv6 in kernel parameters
      sysctl:
        name: net.ipv6.conf.all.disable_ipv6
        value: '1'
        state: present
        sysctl_set: yes
        reload: yes
      ignore_errors: yes

